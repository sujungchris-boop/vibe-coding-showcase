<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>복음의 불길 · 100/500 비전 (v2.0)</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0c1020; --panel:#151c30; --panel2:#1d2640; --line:#2a3556;
    --text:#e9eefb; --muted:#8c97bb; --gold:#ffd45e; --flame:#ff9a3c;
    --cold:#6f7bff; --danger:#ff6b8a; --good:#43d6a3; --sky:#8fd0ff;
  }
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse 80% 60% at 50% -10%, #18223f 0, transparent 60%), var(--bg);
    background-color:var(--bg);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;z-index:5;
    background:rgba(16,22,42,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .logo{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .logo .fl{color:var(--flame)}
  .stat{display:flex;flex-direction:column;line-height:1.1}
  .stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .stat .v .sub{font-size:12px;color:var(--muted);font-weight:700}
  .stat .l{font-size:10px;color:var(--muted);letter-spacing:.04em}
  .grace .v{color:var(--gold);text-shadow:0 0 14px rgba(255,212,94,.5)}
  .miss .v{color:var(--sky);text-shadow:0 0 14px rgba(143,208,255,.45)}
  .church .v{color:var(--good);text-shadow:0 0 14px rgba(67,214,163,.45)}
  .secwrap{flex:1;min-width:150px;max-width:340px}
  .secwrap .l{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px;font-weight:700}
  #s-sec-n{font-weight:800;font-variant-numeric:tabular-nums;transition:color .3s}
  .secbar{height:13px;border-radius:100px;background:var(--panel2);overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  .secbar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6f7bff,#b14bff 55%,#ff4d6d);box-shadow:0 0 12px rgba(255,77,109,.6);transition:width .35s}
  .secbar.peril{animation:peril .9s infinite}
  @keyframes peril{50%{box-shadow:0 0 16px var(--danger),inset 0 0 8px rgba(255,77,109,.5)}}
  .speedbtns{display:flex;gap:6px;margin-left:auto}
  .speedbtns button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer}
  .speedbtns button.on{background:var(--flame);border-color:var(--flame);color:#251200}
  .btn-menu{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:14px;padding:6px 11px;border-radius:8px;cursor:pointer}

  .game{flex:1;display:grid;grid-template-columns:1fr 330px;min-height:0}
  .mapwrap{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse 72% 72% at 50% 44%, #16203f 0%, #0a0e1c 72%)}
  .mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #mapbg{z-index:0}
  #mapbg image{opacity:.92}
  #map{z-index:2}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .link{stroke:var(--line);stroke-width:2;stroke-dasharray:3 6;opacity:.6}
  .link.lit{stroke:var(--flame);opacity:.7;stroke-dasharray:6 5;animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-22}}
  .node{cursor:pointer}
  .node circle.dot{transition:fill .4s}
  .node.live circle.dot{filter:drop-shadow(0 0 5px rgba(255,154,60,.85))}
  .node .ring{fill:none;stroke:var(--gold);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
  .node.sel .ring{opacity:1}
  .node.pulse .ring{opacity:1;animation:ringpulse .72s ease-out}
  @keyframes ringpulse{from{opacity:.95;transform:scale(.45)}to{opacity:0;transform:scale(1.85)}}
  .node text{fill:var(--text);font-size:14px;font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0c1020;stroke-width:3.5px}
  .node .pct{fill:var(--gold);font-size:12px}
  .node .ch{fill:var(--sky);font-size:11px}

  .side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(18,24,44,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);font-weight:800;font-size:13px;padding:12px;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
  .panel{flex:1;overflow-y:auto;padding:16px}
  .panel.hidden{display:none}
  .rg-name{font-size:18px;font-weight:800}
  .rg-sub{font-size:12px;color:var(--muted);margin:2px 0 6px}
  .rg-cul{display:inline-block;font-size:11px;font-weight:700;color:var(--sky);background:rgba(143,208,255,.12);border:1px solid rgba(143,208,255,.25);padding:2px 8px;border-radius:100px;margin-bottom:12px}
  .meter{margin-bottom:9px}
  .meter .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
  .meter .b{height:8px;border-radius:100px;background:var(--panel2);overflow:hidden}
  .meter .b > i{display:block;height:100%;transition:width .35s}
  .rg-grid{display:flex;gap:8px;margin:12px 0}
  .rg-cell{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
  .rg-cell .cv{font-size:16px;font-weight:800}
  .rg-cell .cl{font-size:10px;color:var(--muted);margin-top:1px}
  .rg-cell.ch .cv{color:var(--sky)} .rg-cell.mo .cv{color:var(--good)}
  .btn{width:100%;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;margin-top:6px}
  .btn-send{background:var(--flame);color:#241000;box-shadow:0 6px 18px rgba(255,154,60,.4);animation:cta 1.6s ease-in-out infinite}
  .btn-send:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed;animation:none;box-shadow:none}
  @keyframes cta{50%{box-shadow:0 6px 28px rgba(255,154,60,.7)}}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}
  .rg-special{background:rgba(255,212,94,.1);border:1px solid rgba(255,212,94,.3);border-radius:10px;padding:7px 10px;margin-bottom:10px;font-size:12px;line-height:1.5}
  .rg-special b{color:var(--gold)}

  .up-cat{font-size:11px;font-weight:800;color:var(--flame);letter-spacing:.06em;margin:16px 2px 8px;text-transform:uppercase}
  .up-cat:first-child{margin-top:0}
  .up{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .up .ico{font-size:20px}
  .up .info{flex:1;min-width:0}
  .up .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
  .up .ds{font-size:11px;color:var(--muted);margin-top:1px}
  .lvdots{display:flex;gap:3px}
  .lvdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .lvdots i.on{background:var(--gold)}
  .up button{background:var(--panel);border:1px solid var(--line);color:var(--gold);font-weight:800;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;min-width:56px}
  .up button:disabled{color:var(--muted);cursor:not-allowed;opacity:.55}
  .up.max button{color:var(--good);border-color:var(--good)}

  .news{min-height:40px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 16px;flex-shrink:0;overflow:hidden;background:rgba(16,22,42,.92);backdrop-filter:blur(8px)}
  .news .msg{font-size:13px;color:var(--muted);font-weight:600}
  .news .msg.good{color:var(--good)} .news .msg.bad{color:var(--danger)} .news .msg.sky{color:var(--sky)}
  .news .msg.anim{animation:slidein .4s}
  @keyframes slidein{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

  .evt{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-12px);opacity:0;pointer-events:none;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 20px;z-index:40;
    box-shadow:0 12px 40px rgba(0,0,0,.5);font-weight:800;font-size:14px;transition:opacity .3s,transform .3s;text-align:center}
  .evt.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .evt.good{border-color:var(--good)} .evt.bad{border-color:var(--danger)}
  .evt small{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:3px}

  .vig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse 75% 75% at 50% 45%, transparent 58%, rgba(18,8,26,.28) 100%);transition:background .5s}
  .vig.peril{animation:vigpulse 1.2s ease-in-out infinite}
  @keyframes vigpulse{50%{filter:brightness(1.55) saturate(1.35)}}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;mix-blend-mode:screen}
  @keyframes flashFade{from{opacity:.5}to{opacity:0}}
  .float{position:absolute;transform:translate(-50%,0);font-weight:800;font-size:15px;pointer-events:none;z-index:4;
    text-shadow:0 2px 6px #000;animation:floatUp 1.15s ease-out forwards;white-space:nowrap}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,4px) scale(.8)}16%{opacity:1;transform:translate(-50%,-2px) scale(1.06)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
  .game.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%{transform:translate(-3px,1px)}20%{transform:translate(4px,-2px)}30%{transform:translate(-5px,2px)}40%{transform:translate(4px,1px)}50%{transform:translate(-3px,-1px)}60%{transform:translate(3px,2px)}70%{transform:translate(-2px,-1px)}80%{transform:translate(2px,-1px)}100%{transform:none}}

  .over{position:fixed;inset:0;background:rgba(6,9,18,.86);display:none;align-items:center;justify-content:center;z-index:50}
  .over.show{display:flex}
  .over .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;max-width:410px;text-align:center}
  .over h2{font-size:25px;margin-bottom:8px}
  .over p{color:var(--muted);line-height:1.6;margin-bottom:14px}
  .over .verse{font-size:13px;color:var(--gold);font-style:italic;margin-bottom:18px;line-height:1.5}
  .over button{background:var(--flame);color:#241000;border:none;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:800;cursor:pointer}
  .over .row{display:flex;gap:10px;justify-content:center}
  .over .btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .screen{z-index:55}
  .startbox,.tutbox{background:linear-gradient(180deg,#1a2340,#141b30);border:1px solid var(--line);border-radius:20px;padding:28px 26px;max-width:450px;width:92%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .start-title{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .start-title .fl{color:var(--flame)}
  .start-vision{font-size:13px;font-weight:800;color:var(--sky);margin-bottom:8px}
  .start-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
  .start-sub b{color:var(--text)}
  .start-best{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:16px;min-height:18px}
  .diff-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-bottom:8px;text-align:left}
  .diffs{display:flex;gap:8px;margin-bottom:16px}
  .diff{flex:1;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;cursor:pointer;transition:border-color .15s,transform .1s,background .15s}
  .diff:hover{transform:translateY(-2px)}
  .diff.sel{border-color:var(--flame);background:rgba(255,154,60,.12)}
  .diff .di{font-size:22px} .diff .dn{font-weight:800;font-size:14px;margin-top:2px} .diff .dd{font-size:10px;color:var(--muted);margin-top:2px}
  .start-go{width:100%;background:var(--flame);color:#241000;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(255,154,60,.4)}
  .start-tut{background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;margin-top:12px;text-decoration:underline}
  .tut-card{min-height:172px;text-align:left}
  .tut-card .ti{font-size:32px;margin-bottom:8px} .tut-card h3{font-size:19px;margin-bottom:8px}
  .tut-card p{font-size:14px;color:var(--muted);line-height:1.7} .tut-card b{color:var(--text)}
  .tut-nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .tut-nav button{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:800;font-size:14px;padding:9px 18px;border-radius:10px;cursor:pointer}
  .tut-nav button:disabled{opacity:.35;cursor:default}
  #tut-dots{display:flex;gap:6px} #tut-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block} #tut-dots i.on{background:var(--flame)}
  .tut-skip{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;margin-top:14px}
  .startbox .start-tut{background:none;color:var(--muted);box-shadow:none}
  .tutbox .tut-skip{background:none;color:var(--muted)}

  @media(max-width:860px){
    .game{grid-template-columns:1fr;grid-template-rows:1fr auto}
    .side{border-left:none;border-top:1px solid var(--line);max-height:46vh}
    .secwrap{order:5;max-width:none;flex-basis:100%}
    .start-title{font-size:26px} .diffs{flex-direction:column}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo"><span class="fl">🔥</span> 복음의 불길</div>
    <div class="stat grace"><span class="v" id="s-grace">40</span><span class="l">은혜 💛</span></div>
    <div class="stat miss"><span class="v" id="s-miss">0<span class="sub">/500</span></span><span class="l">✈️ 파송 선교사</span></div>
    <div class="stat church"><span class="v" id="s-church">0<span class="sub">/100</span></span><span class="l">⛪ 개척 교회</span></div>
    <div class="secwrap">
      <div class="l"><span>🕯️ 세속화</span><span id="s-sec-n">0%</span></div>
      <div class="secbar" id="secbar"><i id="s-sec"></i></div>
    </div>
    <div class="speedbtns">
      <button data-spd="0" id="spd0">⏸</button>
      <button data-spd="1" class="on" id="spd1">▶</button>
      <button data-spd="3" id="spd3">▶▶</button>
      <button class="btn-menu" id="btn-menu" title="메뉴 / 난이도">☰</button>
    </div>
  </div>

  <div class="game">
    <div class="mapwrap">
      <svg id="mapbg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <rect x="0" y="0" width="1000" height="500" fill="#0a1022"></rect>
        <image href="https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-dark.jpg"
               x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
        <rect x="0" y="0" width="1000" height="500" fill="#0b1226" opacity="0.4"></rect>
      </svg>
      <canvas id="fx"></canvas>
      <svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="vig" id="vig"></div>
    </div>
    <div class="side">
      <div class="tabs">
        <button class="on" data-tab="region" id="tab-region">지역</button>
        <button data-tab="up" id="tab-up">전도 전략 ✨</button>
      </div>
      <div class="panel" id="panel-region"></div>
      <div class="panel hidden" id="panel-up"></div>
    </div>
  </div>

  <div class="news"><div class="msg" id="news">🔥 한국에서 복음의 불길이 시작됐습니다. 100/500 비전 — 교회 100개·선교사 500명을 향해!</div></div>
  <div class="evt" id="evt"></div>
  <div class="flash" id="flash"></div>

  <div class="over" id="over">
    <div class="box">
      <h2 id="over-t"></h2>
      <p id="over-p"></p>
      <div class="verse" id="over-v"></div>
      <div class="start-best" id="over-rec" style="margin-bottom:18px"></div>
      <div class="row">
        <button id="over-btn">다시 시작</button>
        <button id="over-menu" class="btn-ghost">메뉴</button>
      </div>
    </div>
  </div>

  <div class="over screen" id="start">
    <div class="startbox">
      <div class="start-title"><span class="fl">🔥</span> 복음의 불길</div>
      <div class="start-vision">🎯 100/500 비전 — 교회 100개 개척 · 선교사 500명 파송</div>
      <div class="start-sub">한국에서 시작해, 세속화가 세상을 삼키기 전에 <b>땅 끝까지</b> 비전을 이루라.</div>
      <div class="start-best" id="start-best"></div>
      <div class="diff-label">난이도 선택</div>
      <div class="diffs" id="diffs"></div>
      <button class="start-go" id="start-go">▶ 비전 향해 출발</button>
      <div><button class="start-tut" id="start-tut">❔ 게임 방법 보기</button></div>
      <div><button class="start-tut" id="start-resume" style="display:none">← 진행 중인 게임으로 돌아가기</button></div>
    </div>
  </div>

  <div class="over screen" id="tut">
    <div class="tutbox">
      <div class="tut-card" id="tut-card"></div>
      <div class="tut-nav">
        <button id="tut-prev">‹ 이전</button>
        <span id="tut-dots"></span>
        <button id="tut-next">다음 ›</button>
      </div>
      <button class="tut-skip" id="tut-close">닫기</button>
    </div>
  </div>

<script>
(function(){
  // ── 지역 데이터 (pop=만명, w=부 1~5, cul=문화권) · x,y=등장방형 세계지도 좌표 ──
  const DATA = [
    {id:'kr',n:'한국',     pop:5100,  resist:20, open:80, w:4, cul:'신흥 개방',  x:853,y:140},
    {id:'jp',n:'일본',     pop:12500, resist:55, open:35, w:5, cul:'세속 선진',  x:889,y:159},
    {id:'cn',n:'중국',     pop:140000,resist:78, open:22, w:3, cul:'억압·전통',  x:786,y:150},
    {id:'sea',n:'동남아',  pop:68000, resist:40, open:60, w:2, cul:'다종교',     x:808,y:244},
    {id:'oc',n:'오세아니아',pop:4200, resist:18, open:78, w:5, cul:'세속 선진',  x:872,y:322},
    {id:'in',n:'인도',     pop:138000,resist:52, open:45, w:2, cul:'전통 종교',  x:719,y:190},
    {id:'me',n:'중동',     pop:40000, resist:88, open:12, w:3, cul:'무슬림권',   x:625,y:170},
    {id:'af',n:'아프리카', pop:130000,resist:33, open:67, w:1, cul:'가난·개방',  x:556,y:246},
    {id:'eu',n:'유럽',     pop:74600, resist:48, open:42, w:4, cul:'세속 서구',  x:533,y:112},
    {id:'na',n:'북미',     pop:37000, resist:28, open:65, w:5, cul:'세속 서구',  x:222,y:135},
    {id:'sa',n:'남미',     pop:43000, resist:22, open:72, w:3, cul:'뜨거운 신앙', x:339,y:284},
  ];
  const LINKS = [['kr','jp'],['jp','cn'],['cn','sea'],['sea','in'],['in','me'],['me','af'],['af','eu'],
                 ['eu','na'],['na','sa'],['sa','af'],['sea','oc']];

  // ── 전도 전략 트리 (전염병 진화 트리 벤치마킹) · 레벨은 S.lv에 저장, 효과는 tick에서 직접 계산 ──
  const UPG = [

  // base=매 턴 최소 세속화(멈추지 않는 시계), def=복음화 결손 가중, grace=시작 은혜

  function audioInit(){ try{ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); }catch(e){} }
  function beep(type){ if(!AC)return; const o=AC.createOscillator(),g=AC.createGain(); o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime; let f=523,d=.13,v=.07,w='sine';
    if(type==='send'){f=700;d=.16;} else if(type==='buy'){f=880;d=.14;} else if(type==='church'){f=990;d=.2;v=.08;}
    else if(type==='good'){f=784;d=.3;v=.09;} else if(type==='bad'){f=150;d=.34;v=.11;w='sawtooth';}
    else if(type==='win'){f=659;d=.7;v=.1;} else if(type==='lose'){f=92;d=.8;v=.12;w='sawtooth';}
    o.type=w;o.frequency.value=f;g.gain.setValueAtTime(v,t);
    o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d); }

  // ── 이벤트 ──

  function actives(){return R.filter(r=>r.active)}
  const EVENTS=[

    {t:'📖 성경 대량 배포',    d:'한 지역 저항 -14',    g:1, f:()=>{const r=pick(R);r.resist=Math.max(0,r.resist-14);}},

    {t:'⚠️ 반기독교 법안',     d:'한 지역 저항 +16',    g:0, f:()=>{const r=pick(R);r.resist=Math.min(100,r.resist+16);}},
    {t:'📰 미디어 부정 보도',  d:'세속화 +6%',          g:0, f:()=>{S.sec=Math.min(100,S.sec+6);}},
    {t:'🔒 선교사 추방',       d:'한 지역 신자 -8%',    g:0, f:()=>{const a=actives();if(a.length){const r=pick(a);r.f=Math.max(0,r.f-8);pulse(r.id);}}},
    {t:'🌪️ 자연재해',         d:'한 지역 교회 일부 소실', g:0, f:()=>{const a=actives().filter(r=>r.ch>0);if(a.length){const r=pick(a);r.ch=Math.max(0,r.ch-Math.ceil(r.ch*0.2));}}},
  ];
  function fireEvent(){ const e=pick(EVENTS); e.f(); news(`${e.t} — ${e.d}`, e.g?'good':'bad'); beep(e.g?'good':'bad'); banner(e);
    if(e.g){flash('rgba(120,230,170,.22)');}else{shake();flash('rgba(255,70,100,.4)');} }

  // ── 초기화 ──
  function newGame(diffKey){
    curDiff = DIFF[diffKey] ? diffKey : 'normal'; const D=DIFF[curDiff];
    R = DATA.map(d=>({...d, f:0, mob:0, ch:0, active:false, cap:Math.max(2,Math.round(d.pop/6000))}));
    const kr=R.find(r=>r.id==='kr'); kr.active=true; kr.f=4; kr.mob=8;
    S={grace:D.grace, sec:0, t:0, sentF:8, sent:8, churches:0, diff:curDiff,
       lv:{media:0,relief:0,bible:0,disciple:0,church:0,seminary:0,prayer:0,support:0,martyr:0}};
    sel=kr; over=false;
    ['over','start','tut'].forEach(id=>document.getElementById(id).classList.remove('show'));
    document.getElementById('news').textContent=`🔥 [${D.nm}] 한국에서 시작! 교회 100개·선교사 500명을 향해 땅 끝까지.`;

  }

  // ── 지도 ──
  const svg=document.getElementById('map');
  function buildMap(){
    let h='';
    LINKS.forEach(([a,b])=>{const A=R.find(r=>r.id===a),B=R.find(r=>r.id===b);
      h+=`<line class="link" data-a="${a}" data-b="${b}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/>`;});
    R.forEach(r=>{const rad=9+Math.sqrt(r.pop)/18;
      h+=`<g class="node" data-id="${r.id}" transform="translate(${r.x},${r.y})">
        <circle class="ring" r="${rad+6}"/>
        <circle class="dot" r="${rad}" fill="#39415a" stroke="#0c1020" stroke-width="2"/>
        <text class="nm" y="-${rad+7}">${r.n}</text>
        <text class="pct" y="3">·</text>
        <text class="ch" y="${rad+13}"></text></g>`;});
    svg.innerHTML=h;
    svg.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>{audioInit();sel=R.find(r=>r.id===g.dataset.id);switchTab('region');render();}));
  }
  function fill(r){ if(!r.active) return '#39415a'; const p=r.f; return `hsl(40, ${70+p*0.25}%, ${32+p*0.42}%)`; }
  function pulse(id){const g=svg.querySelector(`.node[data-id="${id}"]`);if(!g)return;g.classList.remove('pulse');setTimeout(()=>g&&g.classList.add('pulse'),12);setTimeout(()=>g&&g.classList.remove('pulse'),790);}

  // ── FX 레이어 ──
  const fx=document.getElementById('fx'), fctx=fx.getContext('2d'),
        vig=document.getElementById('vig'), flashEl=document.getElementById('flash'),
        mapwrap=document.querySelector('.mapwrap'), gameEl=document.querySelector('.game');
  let embers=[], sparks=[], bits=[], fxReady=false, fxLast=0;
  function sizeFx(){ const w=fx.clientWidth,h=fx.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
    fx.width=Math.max(1,w*dpr); fx.height=Math.max(1,h*dpr); fctx.setTransform(dpr,0,0,dpr,0,0); }
  function xform(){ const w=fx.clientWidth,h=fx.clientHeight,s=Math.min(w/1000,h/500); return {s,ox:(w-1000*s)/2,oy:(h-500*s)/2,w,h}; }
  function nodePos(r){ const t=xform(); return {x:t.ox+r.x*t.s, y:t.oy+r.y*t.s, s:t.s}; }
  function nodeRad(r){ return 9+Math.sqrt(r.pop)/18; }
  function burst(rid,rgb,n){ const r=R.find(x=>x.id===rid); if(!r)return; const p=nodePos(r);
    for(let i=0;i<n;i++){ const a=Math.random()*6.2832, sp=(0.8+Math.random()*3)*p.s/2;
      bits.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.6,life:1,rgb,sz:1.4+Math.random()*2.6}); } }
  function floatText(rid,text,color){ const r=R.find(x=>x.id===rid); if(!r)return; const p=nodePos(r);
    const d=document.createElement('div'); d.className='float'; d.textContent=text; d.style.color=color||'#ffd45e';
    d.style.left=p.x+'px'; d.style.top=(p.y-nodeRad(r)*p.s-8)+'px'; mapwrap.appendChild(d); setTimeout(()=>d.remove(),1200); }
  function shake(){ gameEl.classList.remove('shake'); void gameEl.offsetWidth; gameEl.classList.add('shake'); setTimeout(()=>gameEl.classList.remove('shake'),460); }
  function flash(color){ flashEl.style.background=color; flashEl.style.animation='none'; void flashEl.offsetWidth; flashEl.style.animation='flashFade .55s ease-out'; }
  function setVignette(){ const s=S.sec, a=(0.24+s/100*0.62).toFixed(2), stop=Math.max(20,58-s*0.34).toFixed(0), red=Math.round(s*1.15);
    vig.style.background=`radial-gradient(ellipse 75% 75% at 50% 45%, transparent ${stop}%, rgba(${18+red},8,26,${a}) 100%)`;
    vig.classList.toggle('peril', s>=62); if(s>=62) vig.style.animationDuration=(1.35-s/100*0.7)+'s'; }
  function fxFrame(){ const ts=performance.now();
    const w=fx.clientWidth,h=fx.clientHeight; if(!w||!h||!R)return;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    if(fx.width!==Math.round(w*dpr)||fx.height!==Math.round(h*dpr)) sizeFx();
    const dt=Math.min(2.5,(ts-fxLast)/16.67)||1; fxLast=ts;
    fctx.clearRect(0,0,w,h); fctx.globalCompositeOperation='lighter';
    R.forEach(r=>{ if(!r.active)return; const p=nodePos(r), pc=r.f, baseR=nodeRad(r)*p.s, glow=baseR+(10+pc*0.55)*p.s;
      const al=(0.06+pc/100*0.26)*(0.78+0.22*Math.sin(ts/520+r.x*0.1));
      const g=fctx.createRadialGradient(p.x,p.y,baseR*0.4,p.x,p.y,glow);
      g.addColorStop(0,`rgba(255,206,110,${al})`); g.addColorStop(1,'rgba(255,150,40,0)');
      fctx.fillStyle=g; fctx.beginPath(); fctx.arc(p.x,p.y,glow,0,6.2832); fctx.fill(); });
    LINKS.forEach(([a,b])=>{ const A=R.find(r=>r.id===a),B=R.find(r=>r.id===b); if(!A.active||!B.active)return;
      if(Math.random()<0.06){ const src=A.f>=B.f?A:B, dst=src===A?B:A, ps=nodePos(src),pd=nodePos(dst);
        sparks.push({x:ps.x,y:ps.y,tx:pd.x,ty:pd.y,t:0,sp:0.02+Math.random()*0.02}); } });
    sparks=sparks.filter(s=>{ s.t+=s.sp*dt; if(s.t>=1)return false; const x=s.x+(s.tx-s.x)*s.t,y=s.y+(s.ty-s.y)*s.t;
      fctx.fillStyle=`rgba(255,190,90,${(1-s.t)*0.9})`; fctx.beginPath(); fctx.arc(x,y,2.2,0,6.2832); fctx.fill(); return true; });
    if(embers.length<46 && R.some(r=>r.active) && Math.random()<0.5){ const r=pick(actives()), p=nodePos(r);
      embers.push({x:p.x+(Math.random()-0.5)*40,y:p.y,vx:(Math.random()-0.5)*0.3,vy:-(0.3+Math.random()*0.7),life:1,sz:1+Math.random()*2}); }
    embers=embers.filter(e=>{ e.x+=e.vx*dt; e.y+=e.vy*dt; e.life-=0.008*dt; if(e.life<=0)return false;
      fctx.fillStyle=`rgba(255,180,80,${e.life*0.5})`; fctx.beginPath(); fctx.arc(e.x,e.y,e.sz,0,6.2832); fctx.fill(); return true; });
    bits=bits.filter(b=>{ b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=0.045*dt; b.life-=0.022*dt; if(b.life<=0)return false;
      fctx.fillStyle=`rgba(${b.rgb},${b.life.toFixed(2)})`; fctx.beginPath(); fctx.arc(b.x,b.y,b.sz,0,6.2832); fctx.fill(); return true; });
    fctx.globalCompositeOperation='source-over';
  }

  // ── 렌더 ──

  function meter(label,val,col){return `<div class="meter"><div class="l"><span>${label}</span><span>${Math.round(val)}%</span></div>

  function renderRegion(){
    const el=document.getElementById('panel-region'); if(!sel){el.innerHTML='';return;}
    const r=sel;
    const neighborActive=LINKS.some(([a,b])=>(a===r.id&&R.find(x=>x.id===b).active)||(b===r.id&&R.find(x=>x.id===a).active));

          ? `<button class="btn btn-send" id="send">✈️ 선교사 파송 · 은혜 25</button>
             <div class="hint">인접 지역에 복음이 닿았어요. 파송하면 이곳에 불씨가 놓이고 선교사 10명이 갑니다.</div>`
          : `<div class="hint">🔒 아직 길이 닿지 않았어요. <b>연결된</b> 지역을 먼저 개척해야 파송할 수 있어요.</div>`}
    `;
    const sb=document.getElementById('send');
    if(sb){ const cost=r.active?12:25; sb.disabled=S.grace<cost; sb.onclick=()=>send(r); }
  }
  function renderUpgrades(){
    const el=document.getElementById('panel-up'); let h=''; let lastCat='';
    UPG.forEach(u=>{ if(u.cat!==lastCat){h+=`<div class="up-cat">${u.cat}</div>`;lastCat=u.cat;}
      const lv=S.lv[u.id], maxed=lv>=u.max, cost=u.base*(lv+1), can=!maxed&&S.grace>=cost;
      const dots=Array.from({length:u.max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('');
      h+=`<div class="up ${maxed?'max':''}"><div class="ico">${u.ico}</div>

  // ── 액션 ──
  function send(r){
    const cost=r.active?12:25; if(S.grace<cost) return; audioInit(); S.grace-=cost;
    if(!r.active){ r.active=true; r.f=Math.max(r.f,3); news(`✈️ ${r.n}에 선교사 파송! 불씨가 놓였습니다.`,'sky'); }
    else news(`➕ ${r.n} 증파 — 선교사 +10`,'sky');
    r.mob+=10; S.sentF+=10; S.sent=Math.floor(S.sentF);
    beep('send'); pulse(r.id); burst(r.id,'150,210,255',16); floatText(r.id,'✈️ +10','#8fd0ff'); render();
  }
  function levelUp(id){ const u=UPG.find(x=>x.id===id); const lv=S.lv[id]; if(lv>=u.max)return; const cost=u.base*(lv+1);
    if(S.grace<cost)return; audioInit(); S.grace-=cost; S.lv[id]=lv+1;
    news(`${u.ico} ${u.nm} Lv.${lv+1} 적용!`,'good'); beep('buy'); render(); }
  function news(t,cls){const n=document.getElementById('news');n.className='msg'+(cls?' '+cls:'')+' anim';n.textContent=t;n.style.animation='none';void n.offsetWidth;n.style.animation='';}
  function banner(e){const b=document.getElementById('evt');b.className='evt '+(e.g?'good':'bad');b.innerHTML=`${e.t}<small>${e.d}</small>`;
    setTimeout(()=>b.classList.add('show'),12);clearTimeout(banner._t);banner._t=setTimeout(()=>b.classList.remove('show'),2600);}

  // ── 틱 ──
  function tick(){
    if(over) return; S.t++; const L=S.lv, D=DIFF[S.diff]||DIFF.normal;
    // 선교사 자동 양성 → 활성 지역에 분배 (비전 진척)
    const mgen = 1.4 + L.seminary*1.6 + L.support*0.7;
    S.sentF += mgen; S.sent=Math.floor(S.sentF);
    const act=actives(); if(act.length){ const per=mgen/act.length; act.forEach(r=>r.mob+=per); }
    // 은혜 수입: 교회(정착) 기반
    S.grace += 2.5 + S.churches*(0.30+0.18*L.church) + L.prayer*2.5 + L.support*1.2;
    // 전파 + 교회 개척
    let plantedMsg=null;
    R.forEach(r=>{ if(!r.active) return;
      const methodBonus = 0.55*L.media*(r.open/100) + 0.55*L.relief*((6-r.w)/5)
                        + 0.55*L.bible*(r.resist/100) + 0.45*L.disciple + (0.10+0.05*L.church)*Math.min(6,r.ch);
      const missBoost = 1 + 0.05*Math.min(20,r.mob);
      const effResist = r.resist*(1-0.14*L.bible);
      const recept = 0.30 + 0.70*r.open/100;
      const sp = (SPECIAL[r.id]&&SPECIAL[r.id].spread)||1;
      const g = BASE*sp*(1+methodBonus)*missBoost*recept*(1-effResist/100)*(1-r.f/100);
      r.f = Math.min(100, r.f + g);
      // 교회 개척: 신자가 자랄수록 (제자훈련이 문턱을 낮춤). 교회는 소실 외엔 유지.
      const full = Math.max(38, CHURCH_F - 6*L.disciple);
      const target = Math.round(r.cap*Math.min(1, r.f/full));
      if(target>r.ch){ r.ch=target; plantedMsg=r; if(fxReady){burst(r.id,'150,210,255',8);floatText(r.id,'⛪ 교회','#8fd0ff');} }
    });
    S.churches=totalCh();
    if(plantedMsg){ beep('church'); }
    // 세속화 = 신앙 결손 시계 (실제로 복음화해야 느려짐) · 순교자의 피로 둔화
    const deficit=R.reduce((a,r)=>a+(1-Math.min(1,r.f/CHURCH_F)),0)/R.length;
    const mF=1-0.12*L.martyr;
    S.sec=Math.max(0, Math.min(100, S.sec + (D.base + deficit*D.def)*mF));
    if(S.t>8 && S.t%15===0) fireEvent();
    render();
    if(S.churches>=WIN_CH && S.sent>=WIN_MISS) return end(true);
    if(S.sec>=100) return end(false);
  }

  function end(win){
    over=true; setSpeed(0); beep(win?'win':'lose');
    let rec='';
    if(win){
      const wins=(+lsGet('fog2_wins')||0)+1; lsSet('fog2_wins',wins);
      const bk='fog2_best_'+S.diff, prev=+lsGet(bk)||0, isNew=!prev||S.t<prev;
      if(isNew) lsSet(bk,S.t);
      rec=`${isNew?'🏆 신기록! ':''}난이도 ${DIFF[S.diff].nm} · ${S.t}턴 · 최고 ${isNew?S.t:prev}턴 · 누적 달성 ${wins}회`;
    }
    document.getElementById('over-rec').textContent=rec;
    document.getElementById('over-t').textContent=win?'🎉 100/500 비전 달성!':'🕯️ 세속화가 세상을 덮었습니다';
    document.getElementById('over-t').style.color=win?'var(--gold)':'var(--cold)';
    document.getElementById('over-p').textContent=win
      ?`${S.t}턴 만에 교회 ${S.churches}개·선교사 ${S.sent}명 파송! 100/500 비전을 이루었습니다.`
      :`세속화가 100%에 도달했습니다. (교회 ${S.churches}/100 · 선교사 ${S.sent}/500) 다시 도전!`;
    document.getElementById('over-v').textContent=win
      ?'"땅 끝까지 이르러 내 증인이 되리라" — 사도행전 1:8'
      :'"추수할 것은 많되 일꾼이 적으니" — 마태복음 9:37';
    document.getElementById('over').classList.add('show');
  }

  // ── 속도 / 탭 ──
  function setSpeed(s){ audioInit(); speed=s; if(timer)clearInterval(timer); timer=null;
    if(s>0) timer=setInterval(tick, TICK/s);
    [0,1,3].forEach(v=>document.getElementById('spd'+v).classList.toggle('on',v===s)); }
  document.querySelectorAll('.speedbtns button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.spd));
  function switchTab(t){['region','up'].forEach(x=>{document.getElementById('tab-'+x).classList.toggle('on',x===t);
    document.getElementById('panel-'+x).classList.toggle('hidden',x!==t);});}
  document.getElementById('tab-region').onclick=()=>switchTab('region');
  document.getElementById('tab-up').onclick=()=>switchTab('up');
  document.getElementById('over-btn').onclick=()=>newGame(S.diff||curDiff);
  document.getElementById('over-menu').onclick=showStart;
  document.getElementById('btn-menu').onclick=showStart;

  // ── 시작 화면 ──
  function renderDiffs(){
    const el=document.getElementById('diffs');
    el.innerHTML=Object.entries(DIFF).map(([k,d])=>
      `<div class="diff ${k===selDiff?'sel':''}" data-d="${k}"><div class="di">${d.ico}</div><div class="dn">${d.nm}</div><div class="dd">${d.dd}</div></div>`).join('');
    el.querySelectorAll('.diff').forEach(c=>c.onclick=()=>{selDiff=c.dataset.d; renderDiffs(); updateBest();});
  }
  function updateBest(){
    const b=+lsGet('fog2_best_'+selDiff)||0, wins=+lsGet('fog2_wins')||0;
    document.getElementById('start-best').textContent = b
      ? `🏆 ${DIFF[selDiff].nm} 최고: ${b}턴 · 누적 달성 ${wins}회`
      : (wins?`누적 달성 ${wins}회 · ${DIFF[selDiff].nm} 기록 없음` : '아직 기록이 없어요 — 첫 비전 달성에 도전!');
  }
  function showStart(){ prevSpeed=speed||1; setSpeed(0); selDiff=lsGet('fog2_diff')||curDiff||'normal';
    renderDiffs(); updateBest();
    document.getElementById('start-resume').style.display=(!over&&S&&S.t>0)?'inline-block':'none';
    document.getElementById('over').classList.remove('show'); document.getElementById('start').classList.add('show'); }
  document.getElementById('start-go').onclick=()=>{ lsSet('fog2_diff',selDiff); newGame(selDiff); };
  document.getElementById('start-tut').onclick=()=>showTut();
  document.getElementById('start-resume').onclick=()=>{ document.getElementById('start').classList.remove('show'); setSpeed(prevSpeed||1); };

  // ── 튜토리얼 ──
  const TUT=[
    {i:'🎯',h:'100/500 비전',p:'우리 교회의 비전 — <b>교회 100개 개척</b> + <b>선교사 500명 파송</b>. 세속화가 100%가 되기 전에 둘 다 이루면 승리!'},
    {i:'✈️',h:'선교사 파송·양성',p:'<b>연결된 지역</b>에 파송하면 불씨가 놓이고 선교사가 갑니다. 선교사는 매 턴 <b>자동 양성</b>돼 배치되며(비전 500 진척), 그 지역 전파를 가속해요. <b>🏫신학교</b>로 양성을 늘리세요.'},
    {i:'📱',h:'전도 방식은 지역 맞춤',p:'<b>전도 전략 탭</b>의 방식마다 잘 통하는 지역이 달라요 — 📱미디어=개방적인 곳, 🤝구제·봉사=가난한 곳, 📖성경 번역=완고한 곳(중동·중국). 지역 특성을 보고 투자하세요.'},
    {i:'⛪',h:'교회 개척',p:'지역 신자가 자라면 <b>교회가 개척</b>됩니다(인구 큰 곳일수록 많이). 교회는 <b>은혜 수입</b>과 전파를 키우죠. <b>🎓제자훈련</b>은 교회 개척을 앞당깁니다. 목표는 전 세계 100개!'},
    {i:'🕯️',h:'세속화와의 경주',p:'세속화 막대는 <b>멈추지 않고</b> 차오릅니다. 세상을 실제로 복음화할수록 느려지지만 항상 압박이 있어요. <b>🩸순교자의 피</b>로 늦추고, 효율적으로 비전을 이루세요!'},
  ];
  let tutI=0;
  function showTut(){ tutI=0; renderTut(); document.getElementById('tut').classList.add('show'); }
  function renderTut(){
    const t=TUT[tutI];
    document.getElementById('tut-card').innerHTML=`<div class="ti">${t.i}</div><h3>${t.h}</h3><p>${t.p}</p>`;
    document.getElementById('tut-dots').innerHTML=TUT.map((_,i)=>`<i class="${i===tutI?'on':''}"></i>`).join('');
    document.getElementById('tut-prev').disabled=tutI===0;
    document.getElementById('tut-next').textContent=tutI===TUT.length-1?'시작하기 ✓':'다음 ›';
  }
  document.getElementById('tut-prev').onclick=()=>{ if(tutI>0){tutI--;renderTut();} };
  document.getElementById('tut-next').onclick=()=>{ if(tutI<TUT.length-1){tutI++;renderTut();} else {document.getElementById('tut').classList.remove('show'); lsSet('fog2_seen','1');} };
  document.getElementById('tut-close').onclick=()=>{ document.getElementById('tut').classList.remove('show'); lsSet('fog2_seen','1'); };

  // ── 부팅 ──
  curDiff=lsGet('fog2_diff')||'normal'; selDiff=curDiff;
  newGame(curDiff); showStart();
  if(!lsGet('fog2_seen')) showTut();
  sizeFx(); window.addEventListener('resize',sizeFx); fxReady=true; setInterval(fxFrame, 33);
})();
</script>
</body>
