<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결과물 제출 · 바이브코딩</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #23232f;
      --border: #2e2e3e;
      --accent: #7c6ff7;
      --accent2: #5ee8d4;
      --text: #e8e8f0;
      --muted: #7a7a9a;
      --danger: #f87171;
      --success: #4ade80;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    .container { max-width: 720px; margin: 0 auto; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 32px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,111,247,0.15);
      border: 1px solid rgba(124,111,247,0.3);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
    }

    label span.required { color: var(--accent); margin-left: 2px; }

    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus,
    select:focus { border-color: var(--accent); }

    textarea.code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.7;
      resize: vertical;
      min-height: 160px;
    }

    textarea.desc {
      min-height: 80px;
      resize: vertical;
    }

    .name-row { display: flex; gap: 10px; }
    .name-row input { flex: 1; }

    .btn-lookup {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s;
    }
    .btn-lookup:hover { border-color: var(--accent); }

    /* History */
    .history-list { display: flex; flex-direction: column; gap: 10px; }

    .history-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .history-item-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-version {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    .history-title {
      font-size: 14px;
      font-weight: 600;
    }

    .history-time {
      font-size: 11px;
      color: var(--muted);
    }

    .history-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* Auth tabs */
    .auth-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .auth-tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
    }
    .auth-tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-logout:hover { color: var(--danger); border-color: var(--danger); }

    .btn-update {
      background: rgba(124,111,247,0.15);
      border: 1px solid rgba(124,111,247,0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-update:hover { background: rgba(124,111,247,0.25); }

    .btn-delete-work {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-delete-work:hover { background: rgba(248,113,113,0.2); }

    /* Profile photo */
    .profile-block {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: white;
      background-size: cover;
      background-position: center;
    }

    .profile-block-info { flex: 1; }

    .profile-block-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .btn-photo {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .btn-photo:hover { border-color: var(--accent); }

    .empty-history {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    /* Change password button */
    .btn-change-pw {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 8px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-change-pw:hover { border-color: var(--accent); color: var(--accent); }

    .pw-change-modal { margin-bottom: 16px; }

    /* New work button */
    .btn-new-work {
      width: 100%;
      background: rgba(94,232,212,0.1);
      border: 1px dashed rgba(94,232,212,0.4);
      color: var(--accent2);
      font-size: 14px;
      font-weight: 700;
      padding: 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 12px;
    }
    .btn-new-work:hover { background: rgba(94,232,212,0.18); }

    /* AI buttons */
    .btn-ai-new {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #9b7cf9);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      padding: 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 12px;
    }
    .btn-ai-new:hover { opacity: 0.92; }
    .btn-ai-new:active { transform: scale(0.99); }

    .btn-ai {
      background: rgba(124,111,247,0.12);
      border: 1px solid rgba(124,111,247,0.35);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn-ai:hover { background: rgba(124,111,247,0.22); }

    /* Mode tabs (전체 HTML / 분리) */
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-tab-btn {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .mode-tab-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(124,111,247,0.1);
    }

    .mode-tag {
      font-size: 10px;
      font-weight: 800;
      background: var(--accent);
      color: #fff;
      padding: 1px 6px;
      border-radius: 100px;
      letter-spacing: 0.04em;
    }

    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .mode-hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .mode-hint b { color: var(--text); }
    .mode-hint code {
      background: var(--surface2);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    /* Code tabs */
    .code-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .code-tabs {
      display: flex;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .code-tab-btn {
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
      letter-spacing: 0.04em;
    }

    .code-tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .code-panel { display: none; }
    .code-panel.active { display: block; }

    .code-panel textarea {
      border: none;
      border-radius: 0;
      background: #13131c;
    }

    /* Preview */
    .preview-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }

    .preview-toolbar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .preview-toolbar span {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .btn-refresh {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: color 0.15s;
    }
    .btn-refresh:hover { color: var(--text); }

    #preview-iframe {
      width: 100%;
      height: 300px;
      border: none;
      display: block;
    }

    /* Edit banner */
    .edit-banner {
      background: rgba(124,111,247,0.1);
      border: 1px solid rgba(124,111,247,0.3);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-cancel-edit {
      background: none;
      border: 1px solid rgba(124,111,247,0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Submit button */
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 8px;
      letter-spacing: -0.01em;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 100px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">

    <a href="index.html" class="back-link">← 쇼케이스로 돌아가기</a>

    <div class="page-header">
      <div class="badge">✦ Vibe Coding</div>
      <h1>로그인</h1>
      <p>로그인하면 내 작품을 올리거나 수정할 수 있어요.<br>처음이라면 회원가입부터 해주세요.</p>
    </div>

    <!-- 인증: 로그인 / 회원가입 탭 -->
    <div class="section" id="section-auth">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" data-auth="login">로그인</button>
        <button class="auth-tab-btn" data-auth="signup">회원가입</button>
      </div>

      <!-- 로그인 패널 -->
      <div class="auth-panel active" id="auth-login">
        <div class="field">
          <label>이름 <span class="required">*</span></label>
          <input type="text" id="login-name" placeholder="홍길동" maxlength="20">
        </div>
        <div class="field">
          <label>비밀번호 <span class="required">*</span></label>
          <input type="password" id="login-password" placeholder="비밀번호를 입력하세요" maxlength="30">
        </div>
        <button class="btn-submit" id="btn-login" style="margin-top:0">로그인</button>
      </div>

      <!-- 회원가입 패널 -->
      <div class="auth-panel" id="auth-signup">
        <div class="field">
          <label>이름 <span class="required">*</span></label>
          <input type="text" id="signup-name" placeholder="홍길동" maxlength="20">
        </div>
        <div class="field">
          <label>비밀번호 <span class="required">*</span></label>
          <input type="password" id="signup-password" placeholder="사용할 비밀번호" maxlength="30">
        </div>
        <div class="field">
          <label>비밀번호 확인 <span class="required">*</span></label>
          <input type="password" id="signup-password-confirm" placeholder="비밀번호를 다시 입력하세요" maxlength="30">
        </div>
        <div class="field">
          <label>관리자 코드 <span class="required">*</span></label>
          <input type="password" id="signup-admin-code" placeholder="선생님께 받은 코드" maxlength="30">
        </div>
        <button class="btn-submit" id="btn-signup" style="margin-top:0">회원가입</button>
      </div>
    </div>

    <!-- Step 3: 작품 목록 -->
    <div class="section" id="section-history" style="display:none">
      <div class="section-header-row">
        <div class="section-title" style="flex:1">내 작품 목록</div>
        <button class="btn-logout" id="btn-logout">로그아웃</button>
      </div>
      <div class="profile-block">
        <div class="profile-avatar" id="profile-avatar"></div>
        <div class="profile-block-info">
          <div class="profile-block-name" id="profile-block-name"></div>
          <button class="btn-photo" id="btn-photo">📷 프로필 사진 변경</button>
          <input type="file" id="photo-input" accept="image/*" style="display:none">
        </div>
      </div>
      <div class="history-list" id="history-list">
        <div class="loading">불러오는 중...</div>
      </div>
      <button class="btn-ai-new" id="btn-ai-new">✨ AI로 새 작품 만들기</button>
      <button class="btn-new-work" id="btn-new-work">+ 직접 코드 입력해서 추가</button>
      <button class="btn-change-pw" id="btn-change-pw">🔑 비밀번호 변경</button>
    </div>

    <!-- 비밀번호 변경 모달 -->
    <div class="pw-change-modal" id="pw-change-modal" style="display:none">
      <div class="section">
        <div class="section-title">비밀번호 변경</div>
        <div class="field">
          <label>현재 비밀번호 <span class="required">*</span></label>
          <input type="password" id="input-pw-current" placeholder="현재 비밀번호" maxlength="30">
        </div>
        <div class="field">
          <label>새 비밀번호 <span class="required">*</span></label>
          <input type="password" id="input-pw-new" placeholder="새 비밀번호" maxlength="30">
        </div>
        <div class="field">
          <label>새 비밀번호 확인 <span class="required">*</span></label>
          <input type="password" id="input-pw-new-confirm" placeholder="새 비밀번호 다시 입력" maxlength="30">
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn-submit" id="btn-pw-change-submit" style="margin-top:0">변경하기</button>
          <button class="btn-cancel-edit" id="btn-pw-change-cancel" style="padding:10px 20px">취소</button>
        </div>
      </div>
    </div>

    <!-- Edit banner -->
    <div class="edit-banner" id="edit-banner" style="display:none">
      <span id="edit-banner-text">✏️ 수정 모드</span>
      <button class="btn-cancel-edit" id="btn-cancel-edit">취소</button>
    </div>

    <!-- Step 3: 코드 입력 -->
    <div class="section" id="section-form" style="display:none">
      <div class="section-title" id="form-section-title">03 · 결과물 입력</div>

      <div class="field">
        <label>제목 <span class="required">*</span></label>
        <input type="text" id="input-title" placeholder="예: 인터랙티브 파티클" maxlength="50">
      </div>

      <div class="field">
        <label>한 줄 설명</label>
        <textarea class="desc" id="input-desc" placeholder="어떤 걸 만들었는지 간단히 설명해주세요."></textarea>
      </div>

      <div class="field">
        <label>코드 <span class="required">*</span></label>

        <!-- 입력 방식 선택 -->
        <div class="mode-tabs">
          <button class="mode-tab-btn active" data-mode="full">📄 전체 HTML <span class="mode-tag">추천</span></button>
          <button class="mode-tab-btn" data-mode="split">HTML · CSS · JS 나눠서</button>
        </div>

        <!-- 전체 HTML 모드 -->
        <div class="mode-panel active" id="mode-full">
          <p class="mode-hint">클로드에게 <b>"하나의 HTML 파일로 만들어줘"</b>라고 요청한 결과(<code>&lt;!DOCTYPE html&gt;</code>로 시작하는 코드 전체)를 그대로 붙여넣으세요. p5.js·Three.js·Phaser 같은 라이브러리(CDN)도 잘 작동해요.</p>
          <div class="code-section">
            <textarea class="code" id="code-full" placeholder="<!DOCTYPE html>&#10;<html>&#10;  ...&#10;</html>" style="min-height:240px;border-radius:var(--radius)"></textarea>
          </div>
        </div>

        <!-- 분리 모드 -->
        <div class="mode-panel" id="mode-split">
          <div class="code-section">
            <div class="code-tabs">
              <button class="code-tab-btn active" data-panel="html">HTML</button>
              <button class="code-tab-btn" data-panel="css">CSS</button>
              <button class="code-tab-btn" data-panel="js">JS</button>
            </div>
            <div class="code-panel active" id="panel-html">
              <textarea class="code" id="code-html" placeholder="HTML 코드를 붙여넣으세요"></textarea>
            </div>
            <div class="code-panel" id="panel-css">
              <textarea class="code" id="code-css" placeholder="CSS 코드를 붙여넣으세요"></textarea>
            </div>
            <div class="code-panel" id="panel-js">
              <textarea class="code" id="code-js" placeholder="JavaScript 코드를 붙여넣으세요"></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>미리보기</label>
        <div class="preview-wrap">
          <div class="preview-toolbar">
            <span>Preview</span>
            <button class="btn-refresh" id="btn-refresh">↺ 새로고침</button>
          </div>
          <iframe id="preview-iframe" sandbox="allow-scripts"></iframe>
        </div>
      </div>

      <button class="btn-submit" id="btn-submit">제출하기</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getFirestore, collection, query, where,
      orderBy, getDocs, addDoc, updateDoc, deleteDoc,
      doc, getDoc, setDoc, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import {
      getStorage, ref, uploadBytes, getDownloadURL
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
    import firebaseConfig from './firebase-config.js';
    import { escapeHtml, nameToColor, hashPassword, verifyPassword, isHashed, showToast, buildSrcdoc } from './utils.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentName = '';
    let editingDocId = null;
    let editingVersion = 1;
    let isNewWork = false;
    let studentWorks = [];

    const sectionAuth     = document.getElementById('section-auth');
    const sectionHistory  = document.getElementById('section-history');
    const historyList     = document.getElementById('history-list');
    const sectionForm     = document.getElementById('section-form');
    const editBanner      = document.getElementById('edit-banner');
    const editBannerText  = document.getElementById('edit-banner-text');
    const btnCancelEdit   = document.getElementById('btn-cancel-edit');
    const btnNewWork      = document.getElementById('btn-new-work');
    const inputTitle      = document.getElementById('input-title');
    const inputDesc       = document.getElementById('input-desc');
    const codeHtml        = document.getElementById('code-html');
    const codeCss         = document.getElementById('code-css');
    const codeJs          = document.getElementById('code-js');
    const codeFull        = document.getElementById('code-full');
    let currentMode = 'full'; // 'full' | 'split'
    const btnSubmit       = document.getElementById('btn-submit');
    const previewIframe   = document.getElementById('preview-iframe');
    const formSectionTitle = document.getElementById('form-section-title');

    // Mode tabs (전체 HTML / 분리)
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('mode-' + mode).classList.add('active');
      updatePreview();
    }
    document.querySelectorAll('.mode-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    // Code tabs
    document.querySelectorAll('.code-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.code-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.code-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
      });
    });

    // Preview
    function updatePreview() {
      let srcdoc;
      if (currentMode === 'full') {
        srcdoc = codeFull.value;
      } else {
        srcdoc = `<!DOCTYPE html><html><head><style>${codeCss.value}</style></head><body>${codeHtml.value}<script>${codeJs.value}<\/script></body></html>`;
      }
      previewIframe.srcdoc = srcdoc;
    }

    document.getElementById('btn-refresh').addEventListener('click', updatePreview);
    [codeHtml, codeCss, codeJs, codeFull].forEach(el => {
      el.addEventListener('input', debounce(updatePreview, 800));
    });

    function debounce(fn, delay) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
    }

    // ── 로그인 / 회원가입 탭 ──
    document.querySelectorAll('.auth-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('auth-' + btn.dataset.auth).classList.add('active');
      });
    });

    // ── 로그인 ──
    const btnLogin = document.getElementById('btn-login');
    btnLogin.addEventListener('click', async () => {
      const name = document.getElementById('login-name').value.trim();
      const pw = document.getElementById('login-password').value;
      if (!name) { showToast('이름을 입력해주세요.', 'error'); return; }
      if (!pw) { showToast('비밀번호를 입력해주세요.', 'error'); return; }

      btnLogin.disabled = true;
      btnLogin.textContent = '로그인 중...';
      try {
        const snap = await getDoc(doc(db, 'students', name));
        if (!snap.exists()) {
          showToast('가입되지 않은 이름이에요. 회원가입을 해주세요.', 'error'); return;
        }
        const stored = snap.data().password;
        if (!(await verifyPassword(pw, stored))) {
          showToast('비밀번호가 틀렸어요.', 'error'); return;
        }
        // 레거시 평문 → 해시로 자동 업그레이드
        if (!isHashed(stored)) {
          await updateDoc(doc(db, 'students', name), { password: await hashPassword(pw) });
        }
        currentName = name;
        enterWorkspace();
      } catch (e) {
        console.error(e);
        showToast('오류가 발생했습니다. 다시 시도해주세요.', 'error');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = '로그인';
      }
    });

    // ── 회원가입 ──
    const btnSignup = document.getElementById('btn-signup');
    btnSignup.addEventListener('click', async () => {
      const name = document.getElementById('signup-name').value.trim();
      const pw = document.getElementById('signup-password').value;
      const pwConfirm = document.getElementById('signup-password-confirm').value;
      const adminCode = document.getElementById('signup-admin-code').value;

      if (!name) { showToast('이름을 입력해주세요.', 'error'); return; }
      if (!pw) { showToast('비밀번호를 입력해주세요.', 'error'); return; }
      if (pw !== pwConfirm) { showToast('비밀번호가 일치하지 않아요.', 'error'); return; }
      if (adminCode !== 'chrisna') { showToast('관리자 코드가 올바르지 않아요.', 'error'); return; }

      btnSignup.disabled = true;
      btnSignup.textContent = '가입 중...';
      try {
        const snap = await getDoc(doc(db, 'students', name));
        if (snap.exists()) {
          showToast('이미 가입된 이름이에요. 로그인을 해주세요.', 'error'); return;
        }
        await setDoc(doc(db, 'students', name), {
          name,
          password: await hashPassword(pw),
          createdAt: serverTimestamp(),
        });
        currentName = name;
        showToast('회원가입 완료! 환영합니다 🎉', 'success');
        enterWorkspace();
      } catch (e) {
        console.error(e);
        showToast('오류가 발생했습니다. 다시 시도해주세요.', 'error');
      } finally {
        btnSignup.disabled = false;
        btnSignup.textContent = '회원가입';
      }
    });

    // 엔터키 제출
    ['login-name','login-password'].forEach(id =>
      document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') btnLogin.click(); }));
    ['signup-name','signup-password','signup-password-confirm','signup-admin-code'].forEach(id =>
      document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') btnSignup.click(); }));

    // 로그인 성공 → 작업 공간 진입
    async function enterWorkspace() {
      sectionAuth.style.display = 'none';
      await loadWorks(currentName);
    }

    // 로그아웃
    document.getElementById('btn-logout').addEventListener('click', () => {
      currentName = '';
      editingDocId = null;
      studentWorks = [];
      sectionHistory.style.display = 'none';
      sectionForm.style.display = 'none';
      editBanner.style.display = 'none';
      document.getElementById('pw-change-modal').style.display = 'none';
      ['login-name','login-password','signup-name','signup-password','signup-password-confirm','signup-admin-code']
        .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
      sectionAuth.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ── 비밀번호 변경 ──
    document.getElementById('btn-change-pw').addEventListener('click', () => {
      document.getElementById('pw-change-modal').style.display = 'block';
      document.getElementById('input-pw-current').value = '';
      document.getElementById('input-pw-new').value = '';
      document.getElementById('input-pw-new-confirm').value = '';
      document.getElementById('pw-change-modal').scrollIntoView({ behavior: 'smooth' });
    });

    document.getElementById('btn-pw-change-cancel').addEventListener('click', () => {
      document.getElementById('pw-change-modal').style.display = 'none';
    });

    document.getElementById('btn-pw-change-submit').addEventListener('click', async () => {
      const current = document.getElementById('input-pw-current').value;
      const next = document.getElementById('input-pw-new').value;
      const nextConfirm = document.getElementById('input-pw-new-confirm').value;

      if (!current || !next) { showToast('모든 항목을 입력해주세요.', 'error'); return; }
      if (next !== nextConfirm) { showToast('새 비밀번호가 일치하지 않아요.', 'error'); return; }

      const btn = document.getElementById('btn-pw-change-submit');
      btn.disabled = true;

      try {
        const snap = await getDoc(doc(db, 'students', currentName));
        if (!(await verifyPassword(current, snap.data().password))) { showToast('현재 비밀번호가 틀렸어요.', 'error'); return; }
        await updateDoc(doc(db, 'students', currentName), { password: await hashPassword(next) });
        document.getElementById('pw-change-modal').style.display = 'none';
        showToast('비밀번호가 변경되었습니다! ✓', 'success');
      } catch (e) {
        console.error(e);
        showToast('변경 실패. 다시 시도해주세요.', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    // ── 작품 목록 로드 ──
    async function loadWorks(name) {
      sectionHistory.style.display = 'block';
      sectionForm.style.display = 'none';
      editBanner.style.display = 'none';
      historyList.innerHTML = '<div class="loading">불러오는 중...</div>';

      try {
        const q = query(
          collection(db, 'works'),
          where('studentName', '==', name),
          orderBy('createdAt', 'desc')
        );
        const snap = await getDocs(q);
        studentWorks = [];
        snap.forEach(d => studentWorks.push({ id: d.id, ...d.data() }));
        renderHistory();
        await renderProfile();
      } catch (e) {
        console.error(e);
        historyList.innerHTML = '<div class="loading">불러오기 실패. 다시 시도해주세요.</div>';
      }
    }

    // ── 프로필 사진 ──
    async function renderProfile() {
      document.getElementById('profile-block-name').textContent = currentName;
      const avatar = document.getElementById('profile-avatar');
      let photoURL = '';
      try {
        const sSnap = await getDoc(doc(db, 'students', currentName));
        if (sSnap.exists()) photoURL = sSnap.data().photoURL || '';
      } catch (e) { /* 무시 */ }
      if (photoURL) {
        avatar.textContent = '';
        avatar.style.backgroundImage = `url('${photoURL}')`;
      } else {
        avatar.style.backgroundImage = '';
        avatar.style.background = nameToColor(currentName);
        avatar.textContent = (currentName || '?')[0];
      }
    }

    document.getElementById('btn-photo').addEventListener('click', () => {
      document.getElementById('photo-input').click();
    });

    document.getElementById('photo-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { showToast('5MB 이하 이미지만 가능해요.', 'error'); return; }

      const btnPhoto = document.getElementById('btn-photo');
      btnPhoto.disabled = true;
      btnPhoto.textContent = '업로드 중...';
      try {
        const ext = (file.name.split('.').pop() || 'png').toLowerCase();
        const storageRef = ref(storage, `profiles/${currentName}-${Date.now()}.${ext}`);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);
        await updateDoc(doc(db, 'students', currentName), { photoURL: url });
        await renderProfile();
        showToast('프로필 사진이 변경되었습니다! ✓', 'success');
      } catch (err) {
        console.error(err);
        showToast('업로드 실패. Storage 설정을 확인해주세요.', 'error');
      } finally {
        btnPhoto.disabled = false;
        btnPhoto.textContent = '📷 프로필 사진 변경';
        e.target.value = '';
      }
    });

    function renderHistory() {
      if (studentWorks.length === 0) {
        historyList.innerHTML = '<div class="empty-history">아직 제출한 작품이 없어요.<br>아래 버튼으로 첫 번째 작품을 제출해보세요!</div>';
        return;
      }
      historyList.innerHTML = '';
      studentWorks.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const date = item.updatedAt?.toDate?.()
          ? item.updatedAt.toDate().toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })
          : (item.createdAt?.toDate?.()
            ? item.createdAt.toDate().toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })
            : '');
        const version = item.version || 1;
        div.innerHTML = `
          <div class="history-item-left">
            <span class="history-version">v${version}</span>
            <span class="history-title">${escapeHtml(item.title || '(제목 없음)')}</span>
            <span class="history-time">${date} 업데이트</span>
          </div>
          <div class="history-actions">
            <button class="btn-ai" data-id="${item.id}">✨ AI 수정</button>
            <button class="btn-update" data-id="${item.id}">업데이트</button>
            <button class="btn-delete-work" data-id="${item.id}">삭제</button>
          </div>
        `;
        div.querySelector('.btn-ai').addEventListener('click', () => openStudio({
          name: currentName,
          editId: item.id,
          version: item.version || 1,
          title: item.title || '',
          desc: item.description || '',
          seedHtml: buildSrcdoc(item),
        }));
        div.querySelector('.btn-update').addEventListener('click', () => startUpdate(item));
        div.querySelector('.btn-delete-work').addEventListener('click', () => deleteWork(item));
        historyList.appendChild(div);
      });
    }

    // ── AI 스튜디오로 이동 (맥락을 sessionStorage로 전달) ──
    function openStudio(ctx) {
      sessionStorage.setItem('studioContext', JSON.stringify(ctx));
      window.location.href = 'studio';
    }
    document.getElementById('btn-ai-new').addEventListener('click', () => {
      if (!currentName) { showToast('먼저 로그인해주세요.', 'error'); return; }
      openStudio({ name: currentName });
    });

    // 새 작품 추가
    btnNewWork.addEventListener('click', () => {
      editingDocId = null;
      isNewWork = true;
      resetForm();
      setMode('full');
      editBanner.style.display = 'none';
      formSectionTitle.textContent = '03 · 새 작품 입력';
      btnSubmit.textContent = '새 작품 제출';
      sectionForm.style.display = 'block';
      sectionForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // 업데이트
    function startUpdate(item) {
      editingDocId = item.id;
      editingVersion = (item.version || 1) + 1;
      isNewWork = false;
      inputTitle.value = item.title || '';
      inputDesc.value  = item.description || '';
      codeHtml.value   = item.html || '';
      codeCss.value    = item.css || '';
      codeJs.value     = item.js || '';
      codeFull.value   = item.fullHtml || '';
      // 저장된 방식에 맞춰 모드 선택 (fullHtml이 있으면 전체 HTML 모드)
      setMode(item.fullHtml && item.fullHtml.trim() ? 'full' : 'split');
      editBanner.style.display = 'flex';
      editBannerText.textContent = `↑ "${escapeHtml(item.title)}" 업데이트 중 (v${item.version || 1} → v${editingVersion})`;
      formSectionTitle.textContent = '03 · 업데이트 내용 입력';
      btnSubmit.textContent = `v${editingVersion}으로 업데이트`;
      sectionForm.style.display = 'block';
      sectionForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 작품 삭제
    async function deleteWork(item) {
      const ok = confirm(`"${item.title || '제목 없음'}" 작품을 삭제하시겠어요?\n이 작업은 되돌릴 수 없습니다.`);
      if (!ok) return;
      try {
        await deleteDoc(doc(db, 'works', item.id));
        showToast('작품이 삭제되었습니다.', 'success');
        // 삭제한 작품을 수정 중이었다면 폼 닫기
        if (editingDocId === item.id) {
          editingDocId = null;
          editBanner.style.display = 'none';
          sectionForm.style.display = 'none';
          resetForm();
        }
        await loadWorks(currentName);
      } catch (e) {
        console.error(e);
        showToast('삭제 실패. 다시 시도해주세요.', 'error');
      }
    }

    btnCancelEdit.addEventListener('click', () => {
      editingDocId = null;
      isNewWork = false;
      editBanner.style.display = 'none';
      sectionForm.style.display = 'none';
      resetForm();
    });

    function resetForm() {
      inputTitle.value = '';
      inputDesc.value  = '';
      codeHtml.value   = '';
      codeCss.value    = '';
      codeJs.value     = '';
      codeFull.value   = '';
      previewIframe.srcdoc = '';
    }

    // Submit
    btnSubmit.addEventListener('click', async () => {
      if (!currentName) { showToast('이름을 먼저 입력해주세요.', 'error'); return; }
      if (!inputTitle.value.trim()) { showToast('제목을 입력해주세요.', 'error'); return; }

      const isFull = currentMode === 'full';
      if (isFull) {
        if (!codeFull.value.trim()) { showToast('HTML 코드를 붙여넣어주세요.', 'error'); return; }
      } else if (!codeHtml.value.trim() && !codeCss.value.trim() && !codeJs.value.trim()) {
        showToast('코드를 하나 이상 입력해주세요.', 'error'); return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = '저장 중...';

      // 모드별로 필드 저장. 반대편 필드는 비워서 데이터가 섞이지 않게 함.
      const data = {
        studentName: currentName,
        title: inputTitle.value.trim(),
        description: inputDesc.value.trim(),
        fullHtml: isFull ? codeFull.value : '',
        html: isFull ? '' : codeHtml.value,
        css:  isFull ? '' : codeCss.value,
        js:   isFull ? '' : codeJs.value,
        updatedAt: serverTimestamp(),
      };

      try {
        if (editingDocId) {
          // 업데이트: 버전 증가
          await updateDoc(doc(db, 'works', editingDocId), {
            ...data,
            version: editingVersion,
          });
          showToast(`v${editingVersion}으로 업데이트되었습니다! ✓`, 'success');
          editingDocId = null;
          editBanner.style.display = 'none';
        } else {
          // 새 작품
          await addDoc(collection(db, 'works'), {
            ...data,
            version: 1,
            createdAt: serverTimestamp(),
          });
          showToast('새 작품이 제출되었습니다! ✓', 'success');
        }

        sectionForm.style.display = 'none';
        resetForm();
        await loadWorks(currentName);
      } catch (e) {
        console.error(e);
        showToast('저장 실패. 다시 시도해주세요.', 'error');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = '제출하기';
      }
    });

  </script>

</body>
</html>
