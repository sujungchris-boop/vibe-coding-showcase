<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="바이브코딩 쇼케이스">
  <meta property="og:description" content="AI와 함께 만든 학생 결과물 모음">
  <title>바이브코딩 쇼케이스</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #23232f;
      --border: #2e2e3e;
      --accent: #7c6ff7;
      --accent2: #5ee8d4;
      --text: #e8e8f0;
      --muted: #7a7a9a;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 60px 24px 48px;
      text-align: center;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,111,247,0.15) 0%, transparent 70%);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .header-nav {
      position: absolute;
      top: 20px;
      right: 24px;
    }

    .btn-submit-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: white;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 100px;
      text-decoration: none;
      transition: opacity 0.15s;
      letter-spacing: -0.01em;
    }

    .btn-submit-link:hover { opacity: 0.85; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,111,247,0.15);
      border: 1px solid rgba(124,111,247,0.3);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    header h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    header h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 32px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Filter ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 24px 24px 0;
      max-width: 1100px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-right: 4px;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(124,111,247,0.1);
    }

    /* ── Grid ── */
    .grid-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(124,111,247,0.2);
    }

    .card-preview {
      position: relative;
      width: 100%;
      height: 180px;
      background: var(--surface2);
      overflow: hidden;
    }

    .card-preview iframe {
      width: 200%;
      height: 200%;
      transform: scale(0.5);
      transform-origin: top left;
      pointer-events: none;
      border: none;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(26,26,36,0.85) 100%);
    }

    .card-version {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(94,232,212,0.15);
      border: 1px solid rgba(94,232,212,0.3);
      color: var(--accent2);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
      letter-spacing: 0.04em;
    }

    .card-body {
      padding: 14px 16px 16px;
    }

    .card-name {
      font-size: 11px;
      color: var(--accent2);
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .card-name-link {
      color: var(--accent2);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .card-name-link:hover {
      text-decoration: underline;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Empty / Loading */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .state-msg .icon { font-size: 32px; margin-bottom: 12px; display: block; opacity: 0.5; }

    /* Footer */
    footer {
      text-align: center;
      padding: 32px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

  <header>
    <nav class="header-nav">
      <a href="submit.html" class="btn-submit-link">✦ 결과물 제출</a>
    </nav>
    <div class="badge">✦ 커버넌트 하이스쿨 바이브코딩 아카이브</div>
    <h1>AI로 만드는<br><span>KIDS 교구 프로젝트</span></h1>
    <p>커버넌트 하이스쿨 학생들이 인공지능 활용 수업을 통해 직접 만든 결과물 아카이브입니다.<br>어린이 주일학교(KIDS)를 위한 게이미피케이션 교구를 바이브코딩으로 제작합니다.</p>
    <div class="stats">
      <div>
        <div class="stat-number" id="stat-works">-</div>
        <div class="stat-label">결과물</div>
      </div>
      <div>
        <div class="stat-number" id="stat-students">-</div>
        <div class="stat-label">학생</div>
      </div>
    </div>
  </header>

  <!-- Student filter -->
  <div class="filter-bar" id="filter-bar">
    <span class="filter-label">학생</span>
    <button class="filter-btn active" data-student="all">전체</button>
  </div>

  <!-- Grid -->
  <section class="grid-section">
    <div class="grid" id="grid">
      <div class="state-msg">
        <span class="icon">⬡</span>
        데이터를 불러오는 중...
      </div>
    </div>
  </section>

  <footer>
    바이브코딩 수업 결과물 아카이브 · 모든 코드는 AI와의 협업으로 생성되었습니다.
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import {
      getFirestore, collection, query,
      orderBy, onSnapshot
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import firebaseConfig from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let allWorks = [];
    let activeStudent = 'all';

    const q = query(collection(db, 'works'), orderBy('createdAt', 'desc'));
    onSnapshot(q, snap => {
      allWorks = [];
      snap.forEach(d => allWorks.push({ id: d.id, ...d.data() }));
      updateStats();
      updateFilters();
      renderGrid();
    }, err => {
      console.error(err);
      document.getElementById('grid').innerHTML =
        '<div class="state-msg"><span class="icon">⚠️</span>데이터를 불러올 수 없습니다.<br>Firebase 설정을 확인해주세요.</div>';
    });

    function updateStats() {
      document.getElementById('stat-works').textContent = allWorks.length;
      const names = new Set(allWorks.map(w => w.studentName));
      document.getElementById('stat-students').textContent = names.size;
    }

    function updateFilters() {
      const names = [...new Set(allWorks.map(w => w.studentName).filter(Boolean))].sort();
      const bar = document.getElementById('filter-bar');
      bar.querySelectorAll('[data-student]:not([data-student="all"])').forEach(el => el.remove());
      names.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (activeStudent === name ? ' active' : '');
        btn.dataset.student = name;
        btn.textContent = name;
        btn.addEventListener('click', () => setStudent(name));
        bar.appendChild(btn);
      });
    }

    function setStudent(s) {
      activeStudent = s;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.student === s);
      });
      renderGrid();
    }

    document.querySelector('[data-student="all"]').addEventListener('click', () => setStudent('all'));

    function renderGrid() {
      const grid = document.getElementById('grid');
      const works = activeStudent === 'all'
        ? allWorks
        : allWorks.filter(w => w.studentName === activeStudent);

      if (works.length === 0) {
        grid.innerHTML = '<div class="state-msg"><span class="icon">⬡</span>아직 제출된 결과물이 없어요.</div>';
        return;
      }

      grid.innerHTML = '';
      works.forEach(w => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `work?id=${w.id}`;
        const srcdoc = buildSrcdoc(w);
        const versionLabel = w.version ? `v${w.version}` : (w.round || '');
        card.innerHTML = `
          <div class="card-preview">
            <iframe srcdoc="${escapeAttr(srcdoc)}" sandbox="allow-scripts" loading="lazy"></iframe>
            <div class="card-overlay"></div>
            ${versionLabel ? `<span class="card-version">${escapeHtml(versionLabel)}</span>` : ''}
          </div>
          <div class="card-body">
            <div class="card-name">
              <a class="card-name-link" href="student?name=${encodeURIComponent(w.studentName)}" onclick="event.stopPropagation()">${escapeHtml(w.studentName)}</a>
            </div>
            <div class="card-title">${escapeHtml(w.title || '(제목 없음)')}</div>
            <div class="card-desc">${escapeHtml(w.description || '')}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function buildSrcdoc(w) {
      return `<!DOCTYPE html><html><head><style>${w.css||''}</style></head><body>${w.html||''}<script>${w.js||''}<\/script></body></html>`;
    }

    function escapeAttr(str) {
      return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>

</body>
</html>
