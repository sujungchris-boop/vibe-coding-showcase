<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 스튜디오 · 바이브코딩</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .back-link {
      color: var(--muted); font-size: 13px; font-weight: 600;
      text-decoration: none; transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }
    .topbar-title { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
    .topbar-title .tag {
      font-size: 10px; font-weight: 800; color: var(--accent);
      background: rgba(255,106,169,0.15); border: 1px solid rgba(255,106,169,0.3);
      padding: 2px 8px; border-radius: 100px; margin-left: 8px; letter-spacing: 0.06em;
    }
    .btn-ghost {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text);
      font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius);
      cursor: pointer; transition: border-color 0.15s;
    }
    .btn-ghost:hover { border-color: var(--accent); }

    /* Layout */
    .studio {
      flex: 1; display: grid; grid-template-columns: 380px 1fr;
      min-height: 0;
    }

    /* Chat pane */
    .chat {
      display: flex; flex-direction: column; min-height: 0;
      border-right: 1px solid var(--border);
    }

    /* 디자인씽킹 단계 띠 */
    .dt-steps {
      display: flex; align-items: center; gap: 5px; padding: 10px 12px; flex-shrink: 0;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .dt-step {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      font-family: var(--display); font-size: 13px; padding: 7px 4px; border-radius: 100px;
      cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .dt-step .dt-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 50%; background: var(--border); color: #fff;
      font-size: 10px; flex-shrink: 0;
    }
    .dt-step:hover { border-color: var(--accent); color: var(--text); }
    .dt-step.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .dt-step.active .dt-num { background: #fff; color: var(--accent); }
    .chat-log {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .chat-empty {
      margin: auto; text-align: center; color: var(--muted); font-size: 13px;
      line-height: 1.7; max-width: 280px;
    }
    .chat-empty b { color: var(--text); display: block; margin-bottom: 8px; font-size: 15px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .example-chip {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      font-size: 12px; padding: 7px 12px; border-radius: 100px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .example-chip:hover { border-color: var(--accent); color: var(--text); }

    .msg { max-width: 92%; font-size: 13px; line-height: 1.6; }
    .msg.user {
      align-self: flex-end; background: var(--accent); color: #fff;
      padding: 10px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap;
    }
    .msg.ai {
      align-self: flex-start; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 10px 14px; border-radius: 14px 14px 14px 4px;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.ai .v {
      display: inline-block; font-weight: 800; font-size: 11px; color: var(--accent2);
      background: rgba(78,205,196,0.12); border: 1px solid rgba(78,205,196,0.3);
      padding: 1px 7px; border-radius: 100px; margin-right: 6px;
    }
    .msg.ai.error { border-color: var(--danger); color: var(--danger); }
    .msg.loading { align-self: flex-start; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
    .dots span { animation: blink 1.2s infinite both; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    .chat-input-wrap {
      border-top: 1px solid var(--border); padding: 14px; flex-shrink: 0;
    }
    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
    #chat-input {
      flex: 1; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-family: inherit;
      padding: 10px 12px; border-radius: var(--radius); resize: none;
      outline: none; max-height: 120px; line-height: 1.5;
    }
    #chat-input:focus { border-color: var(--accent); }
    .btn-send {
      background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      width: 42px; height: 42px; font-size: 18px; cursor: pointer; flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .btn-send:hover { opacity: 0.9; }
    .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Preview pane */
    .preview { display: flex; flex-direction: column; min-height: 0; background: var(--surface2); }
    .preview-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .preview-toolbar .label {
      font-size: 11px; color: var(--muted); font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .preview-actions { display: flex; gap: 8px; }
    .btn-mini {
      background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
      font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .btn-mini:hover { color: var(--text); border-color: var(--accent); }
    .btn-publish {
      background: var(--accent2); border: none; color: #06221d;
      font-size: 12px; font-weight: 800; padding: 6px 16px; border-radius: 8px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-publish:hover { opacity: 0.9; }
    .btn-publish:disabled { opacity: 0.35; cursor: not-allowed; }

    .preview-frame-wrap { flex: 1; min-height: 0; background: #fff; }
    #preview-iframe { width: 100%; height: 100%; border: none; display: block; }
    .preview-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px; background: var(--bg); text-align: center; padding: 20px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 26px; width: 100%; max-width: 380px;
    }
    .modal h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .modal p.sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
    .modal label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .modal .field { margin-bottom: 14px; }
    .modal input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 14px; padding: 10px 12px; border-radius: var(--radius);
      outline: none; font-family: inherit;
    }
    .modal input:focus { border-color: var(--accent); }
    .code-box {
      width: 100%; height: 320px; resize: vertical; margin-bottom: 14px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12px; line-height: 1.5; padding: 12px; outline: none; white-space: pre;
    }
    .code-box:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn-primary {
      flex: 1; background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
      font-size: 14px; font-weight: 700; padding: 11px; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-cancel {
      background: none; border: 1px solid var(--border); color: var(--muted);
      font-size: 14px; font-weight: 600; padding: 11px 18px; border-radius: var(--radius); cursor: pointer;
    }

    /* 태블릿·폰: 채팅/미리보기 탭 토글 (한 번에 하나 전체폭) */
    .studio-tabs { display: none; }
    @media (max-width: 900px) {
      .studio { grid-template-columns: 1fr; }
      .studio-tabs {
        display: flex; gap: 8px; padding: 10px 14px; flex-shrink: 0;
        border-bottom: 1px solid var(--border); background: var(--surface);
      }
      .studio-tab {
        flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
        font-family: var(--display); font-size: 15px; padding: 10px; border-radius: 100px; cursor: pointer;
      }
      .studio-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      .chat { border-right: none; display: flex; }
      .preview { display: none; }
      .studio.show-preview .chat { display: none; }
      .studio.show-preview .preview { display: flex; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="back-link">← 쇼케이스</a>
      <span class="topbar-title">AI 스튜디오 <span class="tag">BETA</span></span>
    </div>
    <button class="btn-ghost" id="btn-new">+ 새로 시작</button>
  </div>

  <!-- 태블릿·폰 전용: 채팅/미리보기 전환 -->
  <div class="studio-tabs">
    <button class="studio-tab active" data-pane="chat">💬 채팅</button>
    <button class="studio-tab" data-pane="preview">👁 미리보기</button>
  </div>

  <div class="studio">
    <!-- 채팅 -->
    <div class="chat">
      <!-- 디자인씽킹 단계 띠 -->
      <div class="dt-steps">
        <button class="dt-step active" data-stage="empathize"><span class="dt-num">1</span>공감</button>
        <button class="dt-step" data-stage="ideate"><span class="dt-num">2</span>발상</button>
        <button class="dt-step" data-stage="make"><span class="dt-num">3</span>만들기</button>
        <button class="dt-step" data-stage="improve"><span class="dt-num">4</span>개선</button>
      </div>
      <div class="chat-log" id="chat-log">
        <div class="chat-empty" id="chat-empty">
          <b>무엇을 만들어볼까요?</b>
          대화하듯 자유롭게 요청하고, 결과물을 보며 계속 다듬어요.<br>아이디어를 같이 고민하거나 물어봐도 좋아요.
          <div class="chip-row">
            <button class="example-chip">간단한 타이머 앱</button>
            <button class="example-chip">그림 그리기 보드</button>
            <button class="example-chip">퀴즈 게임</button>
            <button class="example-chip">주사위 굴리기</button>
          </div>
        </div>
      </div>
      <div class="chat-input-wrap">
        <div class="chat-input-row">
          <textarea id="chat-input" rows="1" placeholder="만들고 싶은 걸 말하거나 무엇이든 물어보세요"></textarea>
          <button class="btn-send" id="btn-send" title="보내기">↑</button>
        </div>
      </div>
    </div>

    <!-- 미리보기 -->
    <div class="preview">
      <div class="preview-toolbar">
        <span class="label">미리보기</span>
        <span id="size-chip" style="display:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;background:var(--surface2);border:1px solid var(--border);" title="작품 코드 크기 (저장 한도 500KB)"></span>
        <div class="preview-actions">
          <button class="btn-mini" id="btn-refresh">↺ 새로고침</button>
          <button class="btn-mini" id="btn-fullscreen">⛶ 전체화면</button>
          <button class="btn-mini" id="btn-code">&lt;/&gt; 코드</button>
          <button class="btn-publish" id="btn-publish" disabled>✦ 게시하기</button>
        </div>
      </div>
      <div class="preview-frame-wrap">
        <div class="preview-placeholder" id="preview-placeholder">왼쪽에서 아이디어를 보내면<br>여기에 결과물이 바로 나타나요.</div>
        <iframe id="preview-iframe" sandbox="allow-scripts" style="display:none"></iframe>
      </div>
    </div>
  </div>

  <!-- 게시 모달 -->
  <div class="modal-backdrop" id="publish-modal">
    <div class="modal">
      <h2 id="pub-heading">쇼케이스에 게시</h2>
      <p class="sub" id="pub-sub">로그인한 이름으로 작품을 등록해요. 게시하면 메인 갤러리에 나타납니다.</p>
      <div class="field">
        <label>작품 제목</label>
        <input type="text" id="pub-title" placeholder="예: 동물 두더지 잡기" maxlength="50">
      </div>
      <div class="field">
        <label>한 줄 설명</label>
        <input type="text" id="pub-desc" placeholder="어떤 작품인지 한 줄로" maxlength="100">
      </div>
      <div class="field" id="pub-name-field">
        <label>이름</label>
        <input type="text" id="pub-name" placeholder="홍길동" maxlength="20">
      </div>
      <div class="field" id="pub-pw-field">
        <label>비밀번호</label>
        <input type="password" id="pub-password" placeholder="제출 페이지와 같은 비밀번호" maxlength="30">
      </div>
      <div class="modal-actions">
        <button class="btn-primary" id="btn-publish-confirm">게시하기</button>
        <button class="btn-cancel" id="btn-publish-cancel">취소</button>
      </div>
    </div>
  </div>

  <!-- 코드 보기 모달 -->
  <div class="modal-backdrop" id="code-modal">
    <div class="modal" style="max-width:560px">
      <h2>코드 보기</h2>
      <p class="sub">지금 미리보기의 HTML 코드예요. 복사하거나 파일로 받을 수 있어요.</p>
      <textarea id="code-box" class="code-box" readonly spellcheck="false"></textarea>
      <div class="modal-actions">
        <button class="btn-primary" id="btn-code-copy">📋 복사</button>
        <button class="btn-primary" id="btn-code-download">⬇ 다운로드</button>
        <button class="btn-cancel" id="btn-code-close">닫기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import {
      collection, addDoc, updateDoc, doc, getDoc, serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { db, archiveWorkVersion } from './firebase.js';
    import { verifyPassword, showToast, extractHtml, extractEdits, applyEdits } from './utils.js';

    let messages = [];     // { role:'user'|'assistant', content }
    let currentHtml = '';  // 최신 결과물
    let aiVersion = 0;
    let busy = false;

    // ── 워크스페이스에서 넘어온 맥락 (한 번만 소비) ──
    // { name, editId?, version?, title?, desc?, seedHtml? }
    let ctx = null;
    try {
      const raw = sessionStorage.getItem('studioContext');
      if (raw) { ctx = JSON.parse(raw); sessionStorage.removeItem('studioContext'); }
    } catch (e) { ctx = null; }
    const trustedName = ctx?.name || '';     // 로그인 검증된 신원 (있으면 재인증 불필요)
    let editId = ctx?.editId || null;         // 기존 작품 수정이면 그 문서 id
    let editVersion = ctx?.version || 0;      // 기존 작품의 현재 버전
    // (수정 시작점 코드는 currentHtml로 바로 들어가고, 매 요청 시 자동 주입된다)

    const chatLog   = document.getElementById('chat-log');
    const chatEmpty = document.getElementById('chat-empty');
    const input     = document.getElementById('chat-input');
    const btnSend   = document.getElementById('btn-send');
    const iframe    = document.getElementById('preview-iframe');
    const placeholder = document.getElementById('preview-placeholder');
    const btnPublish  = document.getElementById('btn-publish');

    // textarea 자동 높이
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    btnSend.addEventListener('click', send);

    // 예시 칩
    document.querySelectorAll('.example-chip').forEach(chip => {
      chip.addEventListener('click', () => { input.value = chip.textContent + ' 만들어줘'; input.focus(); });
    });

    // ── 디자인씽킹 단계 도우미 ── 각 단계 버튼이 그 단계에 맞는 시작 문장을 입력창에 채워줌(학생이 보고 보냄)
    const DT_STARTERS = {
      empathize: '누구(몇 살 아이)를 위해 만들지 정하고 싶어요. 그 아이가 뭘 좋아하고 뭘 어려워할지 질문해줘요.',
      ideate:    '그 아이에게 맞는 교구 아이디어 3개만 제안해줘요. 각각 왜 좋아할지도 한 줄로요.',
      improve:   '지금 만든 걸 "어린이" 입장에서 보고, 더 좋게 만들 점 2~3개를 알려줘요. 바로 고치진 말고 제안만요.',
    };
    function setStage(stage) {
      document.querySelectorAll('.dt-step').forEach(s => s.classList.toggle('active', s.dataset.stage === stage));
    }
    document.querySelectorAll('.dt-step').forEach(btn => btn.addEventListener('click', () => {
      const stage = btn.dataset.stage;
      if (stage === 'improve' && !currentHtml) { showToast('먼저 결과물을 만든 뒤 개선해요! ✨', 'error'); return; }
      setStage(stage);
      const starter = DT_STARTERS[stage];
      if (starter) {
        input.value = starter;
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      }
      input.focus();
    }));

    // 새로 시작
    document.getElementById('btn-new').addEventListener('click', () => {
      if (busy) return;
      if (messages.length && !confirm('지금까지의 대화와 결과물이 사라져요. 새로 시작할까요?')) return;
      messages = []; currentHtml = ''; aiVersion = 0;
      // 수정 맥락 해제 → 이후엔 새 작품으로 저장 (로그인 신원은 유지)
      editId = null; editVersion = 0;
      document.getElementById('size-chip').style.display = 'none';
      document.querySelector('.topbar-title').innerHTML = 'AI 스튜디오 <span class="tag">BETA</span>';
      chatLog.innerHTML = '';
      chatLog.appendChild(chatEmpty);
      chatEmpty.style.display = '';
      iframe.style.display = 'none'; iframe.srcdoc = '';
      placeholder.style.display = 'flex';
      btnPublish.disabled = true;
      setStage('empathize');
    });

    function addUserMsg(text) {
      chatEmpty.style.display = 'none';
      const el = document.createElement('div');
      el.className = 'msg user';
      el.textContent = text;
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addLoading() {
      const el = document.createElement('div');
      el.className = 'msg loading';
      el.innerHTML = '만드는 중 <span class="dots"><span>·</span><span>·</span><span>·</span></span>';
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
      return el;
    }

    function addAiReply(text, version) {
      const el = document.createElement('div');
      el.className = 'msg ai';
      if (version) {
        const chip = document.createElement('span');
        chip.className = 'v';
        chip.textContent = 'v' + version;
        el.appendChild(chip);
      }
      const span = document.createElement('span');
      span.textContent = text;   // 안전하게 텍스트로 (줄바꿈은 CSS pre-wrap이 유지)
      el.appendChild(span);
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    // 스트리밍용 AI 메시지 (빈 말풍선 생성 → 토큰 도착마다 채움)
    function addLiveAiMsg() {
      chatEmpty.style.display = 'none';
      const el = document.createElement('div');
      el.className = 'msg ai';
      const span = document.createElement('span');
      span.textContent = '…';
      el.appendChild(span);
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
      return { el, span };
    }
    // 생성 중 표시: 코드블록 시작 전 대화 텍스트는 그대로, 코드가 시작되면 "코드 만드는 중"으로
    function liveDisplay(raw) {
      const i = raw.indexOf('```');
      if (i === -1) return raw || '…';
      const before = raw.slice(0, i).trim();
      const isEdit = raw.slice(i, i + 7) === '```edit';
      return (before ? before + '\n\n' : '') + (isEdit ? '🔧 고칠 부분만 콕 집어 수정 중…' : '✨ 코드 만드는 중…');
    }
    // 스트림 완료: 버전 칩 + 최종 reply 텍스트로 마무리
    function finalizeAiMsg(el, span, text, version) {
      if (version) {
        const chip = document.createElement('span');
        chip.className = 'v';
        chip.textContent = 'v' + version;
        el.insertBefore(chip, span);
      }
      span.textContent = text;
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function addErrorMsg(text) {
      const el = document.createElement('div');
      el.className = 'msg ai error';
      el.textContent = '⚠ ' + text;
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function renderPreview(html) {
      placeholder.style.display = 'none';
      iframe.style.display = 'block';
      iframe.srcdoc = html;
      // 작품 크기 게이지 — 학생이 자기 작품 크기를 인지하게 (한도: 저장 500KB)
      const kb = new Blob([html]).size / 1024;
      const chip = document.getElementById('size-chip');
      chip.style.display = 'inline-block';
      chip.textContent = '📄 ' + (kb >= 1000 ? (kb / 1024).toFixed(2) + 'MB' : kb.toFixed(1) + 'KB');
      chip.style.color = kb < 150 ? 'var(--success)' : kb < 300 ? '#e8890c' : 'var(--danger)';
      setStage('improve'); // 만들었으니 다음은 '개선' 단계로 자연스럽게 진행
      // 태블릿·폰: 결과가 나오면 미리보기 탭으로 자동 전환 (학생이 바로 보게)
      if (window.matchMedia('(max-width: 900px)').matches) showPane('preview');
    }

    // 채팅 ↔ 미리보기 탭 토글 (작은 화면에서만 보임)
    function showPane(pane) {
      document.querySelector('.studio').classList.toggle('show-preview', pane === 'preview');
      document.querySelectorAll('.studio-tab').forEach(t => t.classList.toggle('active', t.dataset.pane === pane));
    }
    document.querySelectorAll('.studio-tab').forEach(t =>
      t.addEventListener('click', () => showPane(t.dataset.pane)));

    // (히스토리는 send()에서 append-only로 관리 — 원문을 그대로 쌓아 서버 프롬프트 캐시가
    //  프리픽스를 매 턴 적중시킨다. 코드 전문은 한 번만 실리고, 길어지면 컴팩션으로 접는다.)

    async function send() {
      if (busy) return;
      const text = input.value.trim();
      if (!text) return;

      busy = true;
      btnSend.disabled = true;
      input.value = '';
      input.style.height = 'auto';

      addUserMsg(text);
      // 히스토리는 append-only로 그대로 쌓는다 — 서버의 프롬프트 캐싱이 반복 프리픽스를 90% 할인 처리.
      // 작품 코드 전문은 '한 번만' 히스토리에 실린다(첫 수정 시작 시 주입, 또는 모델의 전체 생성 응답).
      // 이후 수정 턴은 텍스트+```edit만 쌓이고, 모델은 "원본+적용된 수정들"로 최신 상태를 추적한다.
      const histChars = messages.reduce((n, m) => n + m.content.length, 0);
      if (messages.length >= 32 || histChars > 220000) messages = []; // 컴팩션(서버 40개 제한·컨텍스트 보호) → 아래서 최신 코드 재주입
      const hasCode = messages.some(m => m.content.includes('```html'));
      if (currentHtml && !hasCode) {
        messages.push({ role: 'user', content: `[현재 작품 전체 코드]\n\`\`\`html\n${currentHtml}\n\`\`\`\n\n[요청]\n${text}` });
      } else {
        messages.push({ role: 'user', content: text });
      }
      const loadingEl = addLoading();

      let liveMsg = null;
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
        });
        // 가드(429/400 등)는 스트림 시작 전 일반 JSON 상태코드로 옴
        if (!res.ok) {
          let msg = `오류 (${res.status})`;
          try { const j = await res.json(); if (j.error) msg = j.error; } catch (_) {}
          throw new Error(msg);
        }
        loadingEl.remove();
        liveMsg = addLiveAiMsg();

        // SSE 스트림 읽기 — data: {delta} 여러 번, data: {done,usage} 마지막
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let raw = '', buf = '', usage = null, errMsg = null;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buf.indexOf('\n\n')) >= 0) {
            const line = buf.slice(0, sep).trim();
            buf = buf.slice(sep + 2);
            if (!line.startsWith('data:')) continue;
            let ev;
            try { ev = JSON.parse(line.slice(5).trim()); } catch (_) { continue; }
            if (ev.error) errMsg = ev.error;
            else if (ev.delta) { raw += ev.delta; liveMsg.span.textContent = liveDisplay(raw); chatLog.scrollTop = chatLog.scrollHeight; }
            else if (ev.done) usage = ev.usage;
          }
        }
        if (errMsg) throw new Error(errMsg);

        // 스트림 완료 → ① 부분 수정(```edit) ② 통짜 HTML ③ 순수 대화 순으로 해석
        let reply = '', version = null, keepInHistory = true;
        const edits = extractEdits(raw);
        if (edits.truncated) {
          reply = (edits.reply ? edits.reply + '\n\n' : '') +
            '⚠️ 수정 내용이 중간에 잘렸어요. 반영하지 않았으니 "다시 시도해줘"라고 요청해주세요.';
          // 이 턴은 히스토리에서 제거 — 잘린 블록이 남으면 모델이 적용된 걸로 착각하고,
          // user 메시지만 남으면 다음 턴에 user가 연속돼 API가 거부한다(역할 교대 필수).
          messages.pop(); keepInHistory = false;
        } else if (edits.blocks.length > 0 && currentHtml) {
          const res = applyEdits(currentHtml, edits.blocks);
          if (res.ok) {
            currentHtml = res.html;
            aiVersion++; version = aiVersion;
            renderPreview(currentHtml);
            btnPublish.disabled = false;
            reply = (edits.reply ? edits.reply + '\n\n' : '') + `🔧 ${res.applied}군데를 고쳐서 바로 반영했어요!`;
          } else {
            // SEARCH 불일치 = 모델의 상태 추적이 어긋남 → 히스토리를 비워 다음 턴에 최신 코드로 재기준.
            reply = (edits.reply ? edits.reply + '\n\n' : '') +
              `⚠️ 수정 위치가 어긋나 반영하지 않았어요 (${res.applied}/${edits.blocks.length}곳만 일치). "다시 해줘"라고 하면 최신 코드 기준으로 다시 맞춰서 시도해요.`;
            messages = []; keepInHistory = false;
          }
        } else {
          const ex = extractHtml(raw);
          reply = (ex.reply || '').trim();
          if (ex.html) {
            currentHtml = ex.html;
            aiVersion++; version = aiVersion;
            renderPreview(currentHtml);
            btnPublish.disabled = false;
          }
        }
        // 히스토리에는 응답 원문을 그대로 쌓는다(append-only) — 전체 코드 응답이 곧 다음 턴들의 기준이 되고,
        // 프리픽스가 바이트 단위로 안정되어 서버 프롬프트 캐시가 매 턴 적중한다.
        if (keepInHistory) messages.push({ role: 'assistant', content: raw });

        if (!reply) reply = version
          ? `✨ 결과물을 v${version}(으)로 만들었어요. 오른쪽 미리보기를 확인해보세요!`
          : (raw.trim() || '(빈 응답)');
        finalizeAiMsg(liveMsg.el, liveMsg.span, reply, version);

        logUsage(usage);
      } catch (e) {
        loadingEl.remove();
        if (liveMsg) liveMsg.el.remove();
        console.error(e);
        addErrorMsg(e.message || '생성에 실패했어요. 잠시 후 다시 시도해주세요.');
        // 실패한 사용자 메시지는 히스토리에서 빼서 다음 요청이 꼬이지 않게
        messages.pop();
      } finally {
        busy = false;
        btnSend.disabled = false;
        input.focus();
      }
    }

    // ── 토큰 사용량 기록 ──
    async function logUsage(usage) {
      if (!usage) return;
      try {
        await addDoc(collection(db, 'usage'), {
          model: usage.model || '',
          inputTokens: usage.inputTokens || 0,
          outputTokens: usage.outputTokens || 0,
          cacheReadTokens: usage.cacheReadTokens || 0,   // 캐시 히트분 (기본 단가의 10%)
          cacheWriteTokens: usage.cacheWriteTokens || 0, // 캐시 기록분 (기본 단가의 125%)
          stopReason: usage.stopReason || '',            // end_turn=정상완료 / max_tokens=한도 잘림
          totalTokens: usage.totalTokens || 0,
          createdAt: serverTimestamp(),
        });
      } catch (e) { /* 사용량 기록 실패는 사용자 경험에 영향 주지 않음 */ }
    }

    // ── 미리보기 도구 ──
    document.getElementById('btn-refresh').addEventListener('click', () => {
      if (currentHtml) renderPreview(currentHtml);
    });
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (iframe.requestFullscreen) iframe.requestFullscreen();
    });

    // ── 코드 보기 / 복사 / 다운로드 ──
    const codeModal = document.getElementById('code-modal');
    document.getElementById('btn-code').addEventListener('click', () => {
      if (!currentHtml) { showToast('먼저 결과물을 만들어주세요.', 'error'); return; }
      document.getElementById('code-box').value = currentHtml;
      codeModal.classList.add('show');
    });
    document.getElementById('btn-code-close').addEventListener('click', () => codeModal.classList.remove('show'));
    codeModal.addEventListener('click', e => { if (e.target === codeModal) codeModal.classList.remove('show'); });
    document.getElementById('btn-code-copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentHtml);
        showToast('코드를 복사했어요! 📋', 'success');
      } catch (e) {
        document.getElementById('code-box').select();
        showToast('직접 선택해서 복사해주세요.', 'error');
      }
    });
    document.getElementById('btn-code-download').addEventListener('click', () => {
      const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '내작품.html';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast('파일을 받았어요! ⬇', 'success');
    });

    // ── 게시 / 업데이트 ──
    const modal = document.getElementById('publish-modal');
    const confirmBtn = document.getElementById('btn-publish-confirm');

    btnPublish.addEventListener('click', () => {
      if (!currentHtml) return;
      const trusted = !!trustedName;
      // 신뢰된 신원(워크스페이스에서 진입)이면 이름/비번 숨기고 프리필
      document.getElementById('pub-name-field').style.display = trusted ? 'none' : '';
      document.getElementById('pub-pw-field').style.display = trusted ? 'none' : '';

      if (trusted) {
        document.getElementById('pub-name').value = trustedName;
        const t = document.getElementById('pub-title');
        const d = document.getElementById('pub-desc');
        if (!t.value && ctx?.title) t.value = ctx.title;
        if (!d.value && ctx?.desc)  d.value = ctx.desc;
        if (editId) {
          document.getElementById('pub-heading').textContent = '작품 업데이트';
          document.getElementById('pub-sub').textContent = `"${trustedName}"의 작품을 v${editVersion + 1}(으)로 업데이트해요.`;
          confirmBtn.textContent = `v${editVersion + 1}으로 업데이트`;
        } else {
          document.getElementById('pub-heading').textContent = '쇼케이스에 게시';
          document.getElementById('pub-sub').textContent = `"${trustedName}" 이름으로 새 작품을 게시해요.`;
          confirmBtn.textContent = '게시하기';
        }
      } else {
        document.getElementById('pub-heading').textContent = '쇼케이스에 게시';
        document.getElementById('pub-sub').textContent = '제출 페이지의 이름·비밀번호로 작품을 등록해요.';
        confirmBtn.textContent = '게시하기';
      }
      modal.classList.add('show');
      (trusted ? document.getElementById('pub-title') : document.getElementById('pub-name')).focus();
    });

    document.getElementById('btn-publish-cancel').addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

    confirmBtn.addEventListener('click', async () => {
      const title = document.getElementById('pub-title').value.trim();
      const desc  = document.getElementById('pub-desc').value.trim();
      if (!title) { showToast('작품 제목을 입력해주세요.', 'error'); return; }
      if (!currentHtml) { showToast('먼저 결과물을 만들어주세요.', 'error'); return; }
      // 잘림 방어: 결과물이 </html>로 끝나지 않으면(드물게 생성이 끊긴 경우) 게시 전 확인
      if (!/<\/html>\s*$/i.test(currentHtml.trim()) &&
          !confirm('⚠️ 코드가 </html>로 끝나지 않아요 — 중간에 잘린 코드일 수 있어요.\n"이어서 완성해줘"라고 요청해 완성본을 받는 걸 추천해요.\n\n그래도 이대로 게시할까요?')) return;

      const labelDefault = confirmBtn.textContent;
      confirmBtn.disabled = true; confirmBtn.textContent = '저장 중...';
      try {
        // 신원 확정: 신뢰된 신원이면 그대로, 아니면 이름+비번 검증
        let name = trustedName;
        if (!name) {
          name = document.getElementById('pub-name').value.trim();
          const pw = document.getElementById('pub-password').value;
          if (!name) { showToast('이름을 입력해주세요.', 'error'); return; }
          if (!pw)   { showToast('비밀번호를 입력해주세요.', 'error'); return; }
          const snap = await getDoc(doc(db, 'students', name));
          if (!snap.exists()) { showToast('가입되지 않은 이름이에요. 제출 페이지에서 먼저 가입해주세요.', 'error'); return; }
          if (!(await verifyPassword(pw, snap.data().password))) { showToast('비밀번호가 틀렸어요.', 'error'); return; }
        }

        let targetId;
        if (editId) {
          // 기존 작품 업데이트: 덮어쓰기 전 현재 버전을 보관(롤백용) → 버전 증가
          const cur = await getDoc(doc(db, 'works', editId));
          if (cur.exists()) await archiveWorkVersion(editId, cur.data());
          await updateDoc(doc(db, 'works', editId), {
            title, description: desc,
            fullHtml: currentHtml, html: '', css: '', js: '',
            version: editVersion + 1,
            updatedAt: serverTimestamp(),
          });
          targetId = editId;
          showToast(`v${editVersion + 1}으로 업데이트되었습니다! ✓`, 'success');
        } else {
          // 새 작품
          const ref = await addDoc(collection(db, 'works'), {
            studentName: name,
            title, description: desc,
            fullHtml: currentHtml, html: '', css: '', js: '',
            version: 1,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });
          targetId = ref.id;
          showToast('게시 완료! 🎉 쇼케이스로 이동합니다.', 'success');
        }
        modal.classList.remove('show');
        setTimeout(() => { window.location.href = `work?id=${targetId}`; }, 1100);
      } catch (e) {
        console.error(e);
        showToast('저장 실패. 다시 시도해주세요.', 'error');
      } finally {
        confirmBtn.disabled = false; confirmBtn.textContent = labelDefault;
      }
    });

    // ── 워크스페이스 맥락 초기화 (기존 작품 불러오기) ──
    (function initContext() {
      if (ctx?.seedHtml) {
        currentHtml = ctx.seedHtml;
        renderPreview(currentHtml);
        btnPublish.disabled = false;
        chatEmpty.style.display = 'none';
        const note = document.createElement('div');
        note.className = 'msg ai';
        note.textContent = `📂 "${ctx.title || '기존 작품'}"을(를) 불러왔어요. 어떻게 바꿀지 말해보세요!`;
        chatLog.appendChild(note);
      }
      if (editId) {
        document.querySelector('.topbar-title').innerHTML = 'AI 스튜디오 <span class="tag">수정 중</span>';
      }
    })();
  </script>

</body>
